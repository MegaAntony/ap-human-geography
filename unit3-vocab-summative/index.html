<!DOCTYPE html>
<html lang="en">
<head>

<title>Unit 3 Vocabulary Summative – AP Human Geography Study Guide</title>
<style>
:root{--blue:#1a73e8;--blue-d:#174ea6;--blue-l:#e8f0fe;--text:#202124;--text2:#5f6368;--line:#dadce0;--bg:#f8f9fa;--ok:#188038;--ok-bg:#e6f4ea;--bad:#c5221f;--bad-bg:#fce8e6;--warn-bg:#fef7e0}
*{box-sizing:border-box}
body{margin:0;font-family:"Google Sans","Roboto","Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.6;color:var(--text);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
h1{font-size:22px;margin:14px 0 4px;font-weight:500}
.sub{color:var(--text2);font-size:15px;margin:0 0 8px}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
nav button{border:0;background:none;font:inherit;font-size:15px;padding:10px 14px;color:var(--text2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;min-height:44px}

main{padding:20px 0 60px}
section.tab{display:none}section.tab.on{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:0 0 16px}
h2{font-size:21px;font-weight:500;margin:0 0 10px}h3{font-size:18px;font-weight:500;margin:0 0 6px}
button,select,textarea,input{font:inherit}
.btn{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:10px 20px;cursor:pointer;min-height:44px;font-weight:500}

.btn.sec:hover{background:var(--blue-l)}
:focus-visible{outline:3px solid #fbbc04;outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pill{display:inline-block;background:var(--blue-l);color:var(--blue-d);border-radius:12px;padding:1px 10px;font-size:13px;font-weight:500}
.pill.core{background:#e6f4ea;color:#0d652d}.pill.m{background:#e6f4ea;color:#0d652d}.pill.l{background:var(--warn-bg);color:#8a5a00}
label.f{display:flex;flex-direction:column;font-size:14px;color:var(--text2);gap:2px}
select,input[type=search]{padding:8px;border:1px solid var(--line);border-radius:6px;background:#fff;min-height:40px}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:17px;color:var(--text)}
.opt:hover:not([disabled]){background:var(--blue-l);border-color:var(--blue)}
.opt .l{font-weight:700;color:var(--blue-d);min-width:1.4em}
.opt.sel{border-color:var(--blue);background:var(--blue-l)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}.opt.no{background:var(--bad-bg);border-color:var(--bad)}

.hint{background:var(--warn-bg);border-left:4px solid #f9ab00;padding:10px 14px;border-radius:4px;margin:10px 0}
.exp{background:var(--blue-l);border-left:4px solid var(--blue);padding:12px 16px;border-radius:4px;margin:12px 0}
.exp.ok{background:var(--ok-bg);border-left-color:var(--ok)}.exp.no{background:var(--bad-bg);border-left-color:var(--bad)}
.src{font-size:14px;color:var(--text2);border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}
.src q{display:block;font-style:italic;color:var(--text)}
.watch{background:var(--warn-bg);border:1px solid #fde293;border-radius:6px;padding:8px 12px;margin:8px 0;font-size:15px}
details.lc{border:1px solid var(--line);border-radius:8px;margin:8px 0;background:#fff}
details.lc summary{padding:12px 16px;cursor:pointer;font-weight:500;min-height:44px}
details.lc .in{padding:0 16px 14px}
.bar{height:10px;background:#e8eaed;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.fc{min-height:240px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;cursor:pointer;padding:24px}
.fc .back{font-size:17px;text-align:left}
textarea{width:100%;min-height:110px;padding:10px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}th{background:var(--bg)}
.stat{font-size:30px;font-weight:500;color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.note{background:var(--warn-bg);border:1px solid #fde293;border-radius:8px;padding:12px 16px;margin:0 0 16px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px;text-align:left;cursor:pointer;min-height:48px;font-size:15px;color:var(--text)}
.mt button.sel{border-color:var(--blue);background:var(--blue-l)}.mt button.done{background:var(--ok-bg);border-color:var(--ok);cursor:default}.mt button.wrong{background:var(--bad-bg);border-color:var(--bad)}
@media (max-width:600px){body{font-size:16px}.opt{font-size:16px}.mt{grid-template-columns:1fr}}
</style>
</head>

<script>
const D={"T": [{"sec": "3.1 Culture", "term": "Culture", "core": 1, "plain": "The whole way of life a group shares: beliefs, values, practices, behaviors and technologies. It is learned, not inherited.", "dq": ["Slides 3.1", "Culture: The shared beliefs, values, practices, behaviors, and technologies of a society."], "ax": ["Culture is also an invisible force guiding people through shared belief systems, customs, and traditions.", "AMSCO p.132", "Culture is also an invisible force guiding people through shared belief systems, customs, and traditions."], "nx": ["Same definition on your slide; all cultural traits (artifacts, sociofacts, mentifacts) are parts of it.", "Slides 3.1", "Culture comprises the shared practices, technologies, attitudes, behaviors transmitted by a society."], "connect": "The notes give the definition; AMSCO adds that culture is both visible (actions, objects) and invisible (beliefs) — together they show culture is the umbrella for every other Unit 3 term.", "mem": "Culture = the group's shared “operating system.”", "conf": "", "watch": ""}, {"sec": "3.1 Culture", "term": "Cultural traits", "core": 1, "plain": "Single visible or invisible elements that add up to a group's culture.", "dq": ["Slides 3.1", "Cultural Traits: Visible and invisible attributes that combine to make up a group’s culture."], "ax": ["A single automobile can stand for many values, beliefs and behaviors.", "AMSCO p.132", "These types of elements, visible and invisible, are cultural traits."], "nx": ["Your slide lists artifacts, sociofacts and mentifacts as the examples of traits.", "Slides 3.1", "Examples include: - Artifacts - Sociofacts - Mentifacts"], "connect": "Both sources agree traits are visible AND invisible; they are the building blocks that a cultural complex links together.", "mem": "Trait = one Lego brick of culture.", "conf": "cultural complex (many linked traits)", "watch": ""}, {"sec": "3.1 Culture", "term": "Taboos", "core": 1, "plain": "Behaviors a culture kly over large areas; global culture is when they are adopted worldwide. Often starts in cities and spreads through media.", "dq": ["Slides 3.1", "Global/Popular Culture: large, heterogeneous groups of people, often living in urban areas that are interconnected through globalization and the internet/social media."], "ax": ["People around the world follow European soccer, Indian Bollywood movies, and Japanese animation known as anime.", "AMSCO p.135", "People around the world follow European soccer, Indian Bollywood movies, and Japanese animation known as anime."], "nx": ["Same idea in your slide: large, diverse groups connected by the internet; quick to change.", "Slides 3.1", "Quick to change, time-space compression."], "connect": "AMSCO gives examples (soccer, Bollywood, anime); the slide gives the definition and the cause (time-space compression), which sets up 3.6.", "mem": "Pop = popular everywhere, fast.", "conf": "folk culture", "watch": ""}, {"sec": "3.1 Culture", "term": "Cultural landscape", "core": 1, "plain": "The visible human imprint on the land — the built environment.", "dq": ["AMSCO p.138", "the visible reflection of a culture"], "ax": ["Condos in Florida, ski lifts in Colorado and wheat fields in Oklahoma show how humans adapt to the environment.", "AMSCO p.138", "condos on the shores in Florida, ski lifts on the slopes in Colorado, and wheat fields in Oklahoma illustrate the numerous ways humans adjust and adapt to the environment."], "nx": ["Your packet defines it as a natural landscape that people have modified.", "Packet 3.2", "Cultural Landscape: A natural landscape that has been"], "connect": "AMSCO gives the visible-reflection definition and examples; the packet frames it as natural landscape + human change — the same concept.", "mem": "Landscape = what you could photograph.", "conf": "natural environment (no human change)", "watch": ""}, {"sec": "3.1 Culture", "term": "Material culture", "core": 1, "plain": "The tangible things a culture makes — what you can touch or see.", "dq": ["AMSCO p.136", "artifacts that comprise the material culture, which consists of tangible things"], "ax": ["Art, clothing, food, music, sports and housing types are tangible elements of culture.", "AMSCO p.136", "Art, clothing, food, music, sports, and housing types are all tangible elements of culture."], "nx": ["Your slide: artifacts are visible, physical objects created by a culture.", "Slides 3.1", "Artifacts: Visible, physical objects created by a culture."], "connect": "Material culture is the category; artifacts are the individual items in it.", "mem": "Material = matter you can hold.", "conf": "nonmaterial culture", "watch": ""}, {"sec": "3.1 Culture", "term": "Artifacts", "core": 1, "plain": "Visible, physical objects created by a culture (houses, clothing, tools, buildings).", "dq": ["Slides 3.1", "Artifacts: Visible, physical objects created by a culture."], "ax": ["The belief in a god is a mentifact; the religious building or symbols are artifacts.", "AMSCO p.137", "The belief in a god is a mentifact-the religious building or symbols are artifacts."], "nx": ["Your slide lists houses, clothing, architecture, toys, tools and furniture.", "Slides 3.1", "Houses - Clothing - Architecture - Toys - Tools - Furniture"], "connect": "The slide lists artifact types; AMSCO shows the contrast with the belief behind them (a mentifact).", "mem": "Artifact = the thing.", "conf": "mentifact = the idea", "watch": ""}, {"sec": "3.1 Culture", "term": "Mentifacts", "core": 1, "plain": "Ideas, beliefs, values and knowledge — the nonmaterial part of culture.", "dq": ["AMSCO p.137", "Beliefs, values, practices, and aesthetics (pleasing in appearance) determine what a cultural group views as acceptable and desirable."], "ax": ["The belief in a god is a mentifact.", "AMSCO p.137", "The belief in a god is a mentifact-the religious building or symbols are artifacts."], "nx": ["Your slide: mentifacts are ideas, beliefs, values and knowledge.", "Slides 3.1", "Mentifacts: The ideas, beliefs, values and knowledge of a culture."], "connect": "Same concept in both: intangible. Use religion (belief) vs building (artifact) as your go-to pair.", "mem": "Mentifact = “mental” fact.", "conf": "artifact; sociofact", "watch": ""}, {"sec": "3.1 Culture", "term": "Nonmaterial culture", "core": 1, "plain": "Intangible culture; AMSCO says mentifacts comprise it.", "dq": ["AMSCO p.137", "Mentifacts comprise a group's nonmaterial culture"], "ax": ["Beliefs, values, practices and aesthetics are examples.", "AMSCO p.137", "Beliefs, values, practices, and aesthetics (pleasing in appearance) determine what a cultural group views as acceptable and desirable."], "nx": ["Slide examples: religious beliefs, language, food preferences and taboos.", "Slides 3.1", "Religious Beliefs - Language - Food Preferences & Taboos"], "connect": "Nonmaterial culture = the category AMSCO uses; the slide shows concrete mentifact examples.", "mem": "Nonmaterial = can't be touched.", "conf": "material culture", "watch": ""}, {"sec": "3.1 Culture", "term": "Sociofacts", "core": 1, "plain": "The ways a society organizes itself and its people relate: family, government, schools, religion, and also gender roles.", "dq": ["AMSCO p.137", "Cultural groups also possess sociofacts, which are the ways people organize their society and relate to one another."], "ax": ["Western cultures see the nuclear family as the basic unit, while many Western African cultures see the extended family as the norm.", "AMSCO p.137", "Western cultures tend to view the nuclear family, consisting of the parents and their children as the basic family unit."], "nx": ["Your slide: sociofacts are the ways a society behaves and organizes institutions.", "Slides 3.1", "Sociofacts: The ways in which a society behaves and organizes institutions."], "connect": "Both sources use families as the model example. Your slide also includes gender roles, which links to the Gender Doll.", "mem": "Sociofact = “social” facts.", "conf": "artifact; mentifact", "watch": ""}, {"sec": "3.2 Landscapes", "term": "Traditional architecture", "core": 1, "plain": "Style reflecting local history, beliefs and environment, using local materials.", "dq": ["AMSCO p.139", "Traditional architecture style reflects a local culture's history, beliefs, values, and community adaptations to the environment"], "ax": ["Spanish adobe (mud) homes in the Southwest; New England colonial wooden homes with steep-pitched roofs.", "AMSCO p.139", "Examples would include Spanish adobe (mud) homes"], "nx": ["Slide example: a Thule winter house made from local flagstones, whale bone and sod.", "Slides 3.1", "The floors and lower walls are made with flagstones, and the roof is held up by whale bones covered with skins and slabs of rock."], "connect": "AMSCO defines the style; the slide gives an extreme local-materials example, which fits the definition (locally available materials).", "mem": "Traditional = local materials.", "conf": "postmodern architecture", "watch": ""}, {"sec": "3.2 Landscapes", "term": "Postmodern architecture", "core": 1, "plain": "Style after the 1960s: high-rise steel and glass; associated with globalized popular culture.", "dq": ["AMSCO p.140", "Postmodern architecture developed after the 1960s."], "ax": ["Most of the skyscrapers in the US today are postmodern.", "AMSCO p.140", "Most of the skyscapers in the United States today are considered postmodern architectural style."], "nx": ["Your packet: diverse designs that represent popular culture, business and economic success.", "Packet 3.2", "Postmodern Architecture: Diverse designs, representative of popular culture, business and economic success."], "connect": "The packet links the style to its meaning (business, success); AMSCO adds the time (after the 1960s) and materials (steel/glass).", "mem": "Postmodern = steel and glass.", "conf": "traditional architecture", "watch": ""}, {"sec": "3.3 Patterns", "term": "Cultural realms", "core": 1, "plain": "Large areas made of several regions that share traits like language family, religion, food, architecture or history.", "dq": ["AMSCO p.141", "Geographers also identify larger areas, culture realms, that include several regions."], "ax": ["Cultures in a realm share a few traits such as language families, religious traditions, food, architecture or shared history.", "AMSCO p.141", "Cultures within a cultural realm have a few traits that they all share"], "nx": ["Your slide: Anglo-America = English, Christianity; Latin America = Spanish, Roman Catholicism.", "Slides 3.3", "Language: Spanish (Indo-European Family)"], "connect": "AMSCO defines realms; the slides give the Anglo-American and Latin American examples. Remember scale: a small-scale view can be inaccurate.", "mem": "Realm = very big region.", "conf": "cultural region (smaller)", "watch": ""}, {"sec": "3.2 Landscapes", "term": "Sequent occupancy", "core": 1, "plain": "Groups succeed each other in a place, each leaving imprints that accumulate on the landscape.", "dq": ["Packet 3.2", "leave their cultural imprints when they live in a place, each contributing to the overall cultural landscape over time"], "ax": ["Harlem: Jews, then African Americans, then Puerto Ricans, leaving synagogues, Marcus Garvey Park and a boulevard named for a Puerto Rican leader.", "AMSCO p.147", "the neighborhood of Harlem has been home to many ethnic groups"], "nx": ["Packet example: the Great Pyramids.", "Packet 3.2", "How are the Great Pyramids an example of sequent occupancy?"], "connect": "The packet gives the definition; AMSCO shows a living example in Harlem and Pilsen — layers of different groups.", "mem": "Sequent = “in sequence.”", "conf": "neolocalism (re-embracing local identity)", "watch": ""}, {"sec": "3.1 Culture", "term": "Culture hearth", "core": 1, "plain": "The area where a unique culture or specific trait begins before diffusing.", "dq": ["AMSCO p.133", "The area in which a unique culture or a specific trait develops is a culture hearth."], "ax": ["Classical Greece was a culture hearth for democracy; New York City for rap in the 1970s.", "AMSCO p.133", "Classical Greece was a culture hearth for democracy more than 2,000 years ago."], "nx": ["Your slide: the geographic origin of a culture or trait; traits first diffuse from it.", "Slides 3.4", "A cultural hearth is the geographic origin of a culture or cultural trait. Traits first diffuse from the cultural hearth."], "connect": "Hearth = where it starts; diffusion = how it spreads out. These two terms always go together.", "mem": "Hearth = home base of an idea.", "conf": "diffusion", "watch": ""}, {"sec": "3.2 Landscapes", "term": "Ethnicity", "core": 1, "plain": "Membership in a group sharing ancestry, language, customs and history. Different from race (physical traits) and nationality (country).", "dq": ["AMSCO p.140", "Ethnicity refers to membership within a group of people who have common experiences"], "ax": ["Russian Jews make up a different ethnicity than Russians in general.", "AMSCO p.150", "For example, Russian Jews make up a different ethnicity than Russians in general."], "nx": ["Your packet defines ethnicity as belonging bound by common ancestry and culture.", "Packet 3.2", "Ethnicity is a sense of belonging or identity within a group of people bound by common ancestry and culture."], "connect": "Both define it by shared culture/ancestry; AMSCO's Russian Jews example shows how ethnicity differs from nationality.", "mem": "Ethnicity = ancestry + culture.", "conf": "race; nationality", "watch": ""}, {"sec": "3.3 Patterns", "term": "Centripetal forces", "core": 1, "plain": "Forces that unify a country or region.", "dq": ["AMSCO p.150", "Centripetal forces are those that unify a group of people or a region."], "ax": ["The holiday season and the German Christmas tree unify many Americans.", "AMSCO p.150", "The German cultural trait of adorning Christmas trees diffused throughout the United States"], "nx": ["Your slide: characteristics that unify a country and provide stability; common language, ethnicity, religion.", "Slides 3.3", "Characteristics that unify a country and provide stability."], "connect": "Slide gives the definition and the three classic forces; AMSCO adds the Christmas tree example of shared tradition unifying a diverse country.", "mem": "Centripetal = pulls to the center.", "conf": "centrifugal", "watch": ""}, {"sec": "3.3 Patterns", "term": "Centrifugal forces", "core": 1, "plain": "Forces that divide a country or region.", "dq": ["AMSCO p.150", "Centrifugal forces are those that divide a group of people or a region."], "ax": ["Northern Ireland: competition over territory, power and cultural influence between Catholics and Anglicans caused repeated violence.", "AMSCO p.151", "the competition over territory, political power, and cultural influence drove the region into repeated violence over centuries"], "nx": ["Your slide: characteristics that divide a country and create instability, conflict and violence.", "Slides 3.3", "Characteristics that divide a country and create instability, conflict and violence."], "connect": "AMSCO calls them “centripetal forces in reverse.” Northern Ireland shows religion as a dividing force.", "mem": "Centrifugal = flings apart.", "conf": "centripetal", "watch": ""}, {"sec": "3.1 Culture", "term": "Ethnocentrism", "core": 1, "plain": "Judging other cultures by your own standards and believing yours is superior.", "dq": ["AMSCO p.152", "If people are more ethnocentric, they believe their own cultural group is more important and superior to other cultures."], "ax": ["It can cause discrimination, intolerance, violence and tension between states.", "AMSCO p.152", "Ethnocentrism may lead to centrifugal forces within a state, such as discrimination, intolerance, violence, and mass killings."], "nx": ["Your slide gives the same definition.", "Slides 3.1", "Ethnocentrism: Judging other cultures in terms of one's own standards"], "connect": "The slide defines it; AMSCO shows its effect: a centrifugal force. Cultural relativism is the opposite.", "mem": "Ethno-CENTRIC = my culture is the center.", "conf": "cultural relativism", "watch": ""}, {"sec": "3.4 Types of diffusion", "term": "Diffusion", "core": 1, "plain": "The spread of ideas, behaviors and culture from their hearth to wider areas. Two major forms: relocation and expansion.", "dq": ["AMSCO p.154", "The spread of information, ideas, behaviors, and other aspects of culture from their hearths to wider areas is known as diffusion."], "ax": ["The 1918–1919 flu spread across the US from east-coast cities as troops traveled home.", "AMSCO p.154", "The influenza outbreak of 1918-1919, immediately after World War I, diffused"], "nx": ["Your slide: the movement or spread of cultural traits, knowledge, ideas, trends from hearths to other areas.", "Slides 3.4", "Diffusion: The movement or spread of cultural traits, knowledge, ideas, trends from hearths to other geographic areas."], "connect": "Same definition. AMSCO extends it beyond culture to diseases, showing geographers study how anything spreads from a hearth.", "mem": "Diffusion = spread out from the hearth.", "conf": "migration (people move) vs diffusion (trait spreads)", "watch": ""}, {"sec": "3.4 Types of diffusion", "term": "Relocation diffusion", "core": 1, "plain": "A trait spreads because PEOPLE MIGRATE and carry it with them.", "dq": ["AMSCO p.154", "the spread of culture and/ or cultural traits by people who migrate and carry their cultural traits with them"], "ax": ["Italian immigrants brought pizza to the United States in the late 19th century.", "AMSCO p.154", "A small-scale example is the spread of pizza, which Italian immigrants brought to the United States in the late 19th century."], "nx": ["Your slide example: migration of Europeans to the Americas spread Christianity and European languages.", "Slides 3.4", "The migration of Europeans to the Americas in the 13th & 14th centuries resulted in the spread of Christianity"], "connect": "Both examples need people to MOVE. Slide and AMSCO agree on the idea.", "mem": "Relocation = Relocate (move).", "conf": "expansion diffusion (no migration needed)", "watch": "Slide says 13th & 14th centuries; AMSCO says European culture spread starting in the 1500s. Use the date your teacher uses on a test but know AMSCO differs."}, {"sec": "3.4 Types of diffusion", "term": "Expansion diffusion", "core": 1, "plain": "A trait spreads outward through exchange WITHOUT migration — a different person adopts it. Three subtypes: contagious, hierarchical, stimulus.", "dq": ["AMSCO p.155", "The spread of cultural traits outward through exchange without migration is called expansion diffusion."], "ax": ["Unlike relocation diffusion, expansion diffusion requires a different person to adopt the trait.", "AMSCO p.155", "Unlike relocation diffusion, expansion diffusion requires a different person to adopt the trait."], "nx": ["Your slide: there are three subtypes of expansion diffusion.", "Slides 3.4", "There are three subtypes of expansion diffusion"], "connect": "Expansion = the umbrella; contagious, hierarchical and stimulus are the subtypes (reverse hierarchical is a version of hierarchical).", "mem": "Expansion = ideas expand, people stay.", "conf": "relocation diffusion", "watch": ""}, {"sec": "3.4 Types of diffusion", "term": "Contagious diffusion", "core": 1, "plain": "Spreads continuously outward from the hearth through contact between people, like a contagion.", "dq": ["AMSCO p.155", "Contagious diffusion occurs when a cultural trait spreads continuously outward from its hearth through contact among people."], "ax": ["Blues music spread from the southern US northward to St. Louis, Chicago and New York.", "AMSCO p.155", "the hearth for blues music is the southern United States"], "nx": ["Slide example: viral videos; time-space compression has accelerated contagious diffusion via internet and ut they rejected eating beef because doing so would violate their Hindu beliefs."], "nx": ["Your slide: McDonald's adapted to India because eating beef is a taboo.", "Slides 3.4", "It is a TABOO to eat beef."], "connect": "The taboo (a 3.1 term) is the reason for the modification — a good cross-link to use in an FRQ.", "mem": "Stimulus = the idea stimulates, the form changes.", "conf": "relocation / contagious", "watch": ""}, {"sec": "3.4 Types of diffusion", "term": "Reverse hierarchical diffusion", "core": 0, "plain": "Spreads from low-status or rural groups to higher-status or urban ones.", "dq": ["AMSCO p.155", "At times, a trait diffuses from a group of lower status to a group of higher status, in a process called reverse hierarchical diffusion."], "ax": ["Tattoos were once a symbol of low social status (sailors, military bases, prisons) and spread through society; Walmart spread from rural Arkansas.", "AMSCO p.155", "tattoos to be a symbol of low social status"], "nx": ["Your slide uses Hip Hop and Walmart as examples.", "Slides 3.4", "Walmart was initially started in a small town in Arkansas and now has locations internationally"], "connect": "Both sources agree on Walmart. AMSCO adds tattoos; the slide adds hip hop.", "mem": "Reverse = bottom → up.", "conf": "hierarchical", "watch": ""}, {"sec": "3.5 Historic causes", "term": "Lingua franca", "core": 1, "plain": "A common language used by people who do not share a native language — for trade, business, popular culture.", "dq": ["AMSCO p.166", "a lingua franca, a common language used by people who do not share the same native language."], "ax": ["Nigerians speak one of 500 indigenous languages at home but learn English to communicate with everyone.", "AMSCO p.166", "Nigerians commonly speak one of 500 indigenous languages at home, but they learn English to communicate with everyone who does not speak their language."], "nx": ["Your slide: English is the world lingua franca; regionally Mandarin, Swahili, Arabic, Russian.", "Slides 3.5", "Lingua Franca is a common language used by speakers of two different languages for communication."], "connect": "The slide lists regional lingua francas; AMSCO explains why English became one (corporations, science, Internet, movies).", "mem": "Lingua franca = the “bridge language.”", "conf": "pidgin (mixture) and creole (new native language)", "watch": ""}, {"sec": "3.5 Historic causes", "term": "Pidgin language", "core": 1, "plain": "A simplified mixture of two languages used for trade; not anyone's native language.", "dq": ["AMSCO p.166", "a pidgin language, a simplified mixture of two languages."], "ax": ["In Papua New Guinea the pidgin combines English and Papuan languages.", "AMSCO p.166", "In Papua New Guinea, the pidgin combines English and Papuan languages."], "nx": ["Your slide: an extremely simplified, limited non-native language used by two people speaking different languages.", "Slides 3.5", "Pidgin Language: An extremely simplified, limited non-native language used by two people that speak two different languages."], "connect": "Both mention Papua New Guinea. AMSCO adds: fewer grammar rules and a smaller vocabulary than either language.", "mem": "Pidgin = pieces of two languages.", "conf": "creole", "watch": ""}, {"sec": "3.5 Historic causes", "term": "Creole language", "core": 1, "plain": "A pidgin that matured into a full language with native speakers, new grammar and vocabulary.", "dq": ["AMSCO p.166", "a new combined language, known as a creole language."], "ax": ["Haitian Creole is derived mostly from French with influences from West African languages and is an official language of Haiti.", "AMSCO p.167", "Haitian Creole is derived mostly from French with influences from numerous languages of West Africa."], "nx": ["Your slide: a pidgin that develops into a new combined language with native speakers.", "Slides 3.5", "Creole Language: A pidgin language that develops into a new combined language with native speakers."], "connect": "Slide gives the pidgin → creole link; AMSCO’s Haiti example shows the slavery/colonization origin.", "mem": "Creole = Created native language.", "conf": "pidgin (no native speakers)", "watch": ""}, {"sec": "3.6 Contemporary causes", "term": "Social constructs", "core": 1, "plain": "Ideas or perceptions created and accepted by a society — not created by nature.", "dq": ["AMSCO p.168", "Social constructs are ideas, concepts, or perceptions that have been created and accepted by people in a society or social group and are not created by nature."], "ax": ["Cultural ideas and practices are socially constructed and change through urbanization and globalization.", "AMSCO p.168", "Cultural ideas and practices are socially constructed and change through both small-scale and large-scale processes such as urbanization and globalization."], "nx": ["Your slide repeats this idea in the essential knowledge for 3.6.", "Slides 3.6", "Cultural ideas and practices are socially constructed and change through both small-scale and large-scale processes"], "connect": "Both state that culture is made by people, so it can change through media, technology, politics, economics and relationships.", "mem": "Construct = built by people.", "conf": "", "watch": ""}, {"sec": "3.6 Contemporary causes", "term": "Time-space convergence", "core": 1, "plain": "Greater interconnection between places from better transportation/communication; the world “feels smaller.”", "dq": ["AMSCO p.169", "The greater interconnection between places that results from improvements in transportation is called time-space convergence."], "ax": ["Columbus took 36 days to cross the Atlantic (1492); steam cut it to 4.5 days (1907); planes take about 7 hours.", "AMSCO p.169", "in 1492 it took Christopher Columbus 36 days to cross the Atlantic Ocean on a wind-powered ship."], "nx": ["Your slide: the shrinking of the world due to communication and transportation technologies.", "Slides 3.6", "Time-space compression/convergence: The shrinking of the world due to improvements in communication and transportation technologies."], "connect": "Your slide treats compression and convergence as the same idea. It facilitates cultural convergence and diffusion of popular culture.", "mem": "Time-space convergence = distance shrinks.", "conf": "cultural convergence (result)", "watch": ""}, {"sec": "3.6 Contemporary causes", "term": "Cultural convergence", "core": 1, "plain": "Cultures becoming more alike by sharing traits (homogenization).", "dq": ["AMSCO p.170", "cultures are becoming similar to each other and sharing more cultural traits, ideas, and beliefs."], "ax": ["People around the world wear jeans and T-shirts instead of traditional clothing.", "AMSCO p.170", "people around the world wear jeans and t-shirts on a daily basis"], "nx": ["Your slide: two or more cultures in contact adopt each other’s traits and become more alike.", "Slides 3.6", "Cultural Convergence: The process of two or more cultures coming into contact with each other and adopting each other’s traits to become more alike."], "connect": "Cause → effect chain: time-space convergence → cultural convergence → loss of indigenous cultures and languages.", "mem": "Convergence = coming together.", "conf": "cultural divergence", "watch": ""}, {"sec": "3.6 Contemporary causes", "term": "Cultural divergence", "core": 1, "plain": "Cultures becoming LESS alike because of barriers, isolation or deliberate restriction of contact.", "dq": ["AMSCO p.170", "Cultural divergence is the idea that a culture may change over time"], "ax": ["The longer a group is isolated, the more slowly its culture changes or diverges from the original.", "AMSCO p.170", "The longer a group is isolated, the more slowly its culture will change or diverge from the original culture."], "nx": ["Your slide: the Amish are distinctive due to isolation and rejection of electricity and modern technology.", "Slides 3.6", "Amish Culture is distinctive due to isolation from mainstream US culture and a rejection of electricity and modern technologies."], "connect": "The Amish connect divergence to folk culture (3.1): a group chooses to restrict contact to keep its originality.", "mem": "Divergence = drifting apart.", "conf": "cultural convergence", "watch": ""}, {"sec": "3.7 Language", "term": "Indo-European language family", "core": 1, "plain": "The largest language family: a group of languages that may descend from one language spoken about 6,000 years ago; nearly half the world speaks one.", "dq": ["AMSCO p.172", "One of the 15 major language families is the Indo-European language family, a large group of languages that might have descended from a language spoken around 6,000 years ago."], "ax": ["Nearly half of the world's population speaks an Indo-European language.", "AMSCO p.172", "Nearly half of the world's population speaks one of the languages of the Indo-European language family."], "nx": ["Your slides give two origin theories: Kurgan Warrior (hearth in modern Russia/Ukraine, spread by conquest) and Anatolian Farmer (spread by agriculture and population growth).", "Slides 3.7", "Kurgan Warrior Theory: Indo-European language first diffused from a hearth located in modern Russia/Ukraine around 1,000 B.C.E."], "connect": "AMSCO gives the family; slides give the two competing explanations for how it diffused (Kurgan = conquest/migration, Anatolian = farming/migration).", "mem": "Indo-European = Europe + India + more.", "conf": "Sino-Tibetan (second largest)", "watch": "Slides say about 3.2 billion speakers; AMSCO says about 2.8 billion native speakers. Know both, but use your teacher's number on her test."}, {"sec": "3.7 Language", "term": "Romance languages", "core": 1, "plain": "Languages that evolved from Latin after the Roman Empire dissolved: Portuguese, Spanish, French, Italian, Romanian.", "dq": ["AMSCO p.173", "The unifying language of Latin diverged into dozens of distinct regional languages, known as Romance languages."], "ax": ["Portuguese, Spanish, French, Italian and Romanian survived and grew; their historical connection shows in similar words.", "AMSCO p.173", "Most of these later vanished, but Portuguese, Spanish, French, Italian, and Romanian, among others survived and grew."], "nx": ["Your slide: the Romance branch includes Spanish, Portuguese, French and Italian.", "Slides 3.7", "Romance Branch: Includes languages like Spanish, Portugese, French and Italian."], "connect": "Latin split because speakers became isolated after Rome fell — a real example of divergence and of how dialects can become languages.", "mem": "Romance = from Rome.", "conf": "Germanic branch (English, German, Dutch)", "watch": ""}, {"sec": "3.7 Language", "term": "Isoglosses", "core": 1, "plain": "Boundaries between variations in pronunciation or word use; lines that divide dialects.", "dq": ["AMSCO p.173", "The boundaries between variations in pronunciations or word usage are called isoglosses."], "ax": ["In Texas, “dry creek bed” near Dallas turns into “arroyo” farther west; the isogloss marks the boundary.", "AMSCO p.173", "This isogloss represents the boundary between southern dialect and a Texan variation."], "nx": ["Your slide: a geographic boundary within which a linguistic feature occurs; lines that divide dialects.", "Slides 3.7", "Isogloss: A geographic boundary within which a particular linguistic feature occurs."], "connect": "Isoglosses are the map lines; dialects are the regions they separate.", "mem": "Isogloss = a line on a map for a word.", "conf": "dialect (the variation) vs isogloss (the boundary)", "watch": ""}, {"sec": "3.7 Language", "term": "Dialects", "core": 1, "plain": "Regional variations of a language in accent, grammar, usage, spelling — different enough to notice but easily understood.", "dq": ["AMSCO p.173", "Variations in accent, grammar, usage, and spelling create dialects, or regional variations of a language."], "ax": ["American vs. British English: elevator/lift, apartment/flat, trunk/boot.", "AMSCO p.174", "The following chart shows differences between two dialects of EnglishAmerican and British."], "nx": ["Your slide: dialects develop from geographic distance or isolation; examples y'all, you guys, youse guys, you'uns.", "Slides 3.5", "Dialects are variations in accent, grammar, usage and spelling and develop out of geographic distance or isolation."], "connect": "Both link dialects to geography. AMSCO adds that a dialect can eventually become a new language, like Latin → Romance languages.", "mem": "Dialect = different WORDS; accent = different SOUND.", "conf": "accent (pronunciation only)", "watch": ""}, {"sec": "3.7 Language", "term": "Official language", "core": 1, "plain": "The language designated by law for government use (laws, reports, signs, money).", "dq": ["AMSCO p.175", "one designated by law to be the language of government"], "ax": ["Zimbabwe has 16 official languages for its several large ethnic groups and uses English as a lingua franca.", "AMSCO p.175", "Zimbabwe is home to several large ethnic groups, so it has 16 official languages."], "nx": ["Your slide: official languages can be centripetal (unity, cheaper) or centrifugal (marginalize minority languages).", "Slides 3.5", "Official Language is used by the government of a country for laws, reports, signs, public objects, money, stamps."], "connect": "Official language links 3.5 to 3.3: it can unify a diverse state or divide it.", "mem": "Official = by law.", "conf": "lingua franca (informal, not law)", "watch": ""}, {"sec": "3.7 Religion", "term": "Ethnic religions", "core": 1, "plain": "Religions tied to an ethnic group; you are usually born into them; they rarely recruit and spread by relocation diffusion.", "dq": ["AMSCO p.176", "Ethnic religions are belief traditions that emphasize strong cultural characteristics among their followers."], "ax": ["Hinduism and Judaism are the world's two most widespread ethnic religions.", "AMSCO p.176", "Hinduism  which means having one god."], "ax": ["Judaism was among the first monotheistic faiths; Sikhism is a monotheistic faith.", "AMSCO p.178", "Judaism was among the first monotheistic faiths."], "nx": null, "connect": "Judaism, Christianity, Islam and Sikhism are monotheistic in the textbook.", "mem": "Mono = one.", "conf": "polytheistic", "watch": ""}, {"sec": "3.7 Religion", "term": "Hinduism", "core": 1, "plain": "Ethnic religion from India: many deities (polytheistic, but one god behind them), karma, dharma, reincarnation, sacred rivers.", "dq": ["AMSCO p.176", "Classified as an ethnic religion, Hinduism includes the worship of many deities"], "ax": ["Hindus believe in karma — behaviors have consequences in the present or a future life.", "AMSCO p.176", "Hindus believe in karma-the idea that behaviors have consequences in the present life or a future life"], "nx": ["Your slide: the Ganges River is sacred; diffusion is mostly in South Asia, plus relocation to former British colonies, Britain and the US.", "Slides 3.7.2", "Belief that the Ganges River is sacred."], "connect": "Ethnic religion = relocation diffusion: the slide traces Hindu migration from India to former British colonies.", "mem": "Hinduism = ethnic, India, Ganges.", "conf": "Buddhism (grew out of it)", "watch": ""}, {"sec": "3.7 Religion", "term": "Buddhism", "core": 1, "plain": "Universalizing religion founded by Siddhartha (the Buddha) in South Asia; Four Noble Truths, Eightfold Path, nirvana; rejects the caste system.", "dq": ["AMSCO p.176", "Buddhism grew out of the teachings of a prince named Siddhartha who lived around 600 B.C.E."], "ax": ["Buddhism accepted many beliefs of Hinduism but rejected the caste system.", "AMSCO p.176", "Accepting many beliefs of Hinduism but rejecting the caste system"], "nx": ["Your slide: the Buddha is “the Enlightened One”; missionaries and traders spread it (contagious) and Emperor Ashoka's conversion spread it (hierarchical).", "Slides 3.7.2", "Buddha is referred to as \"the Enlightened One\" and directly taught followers."], "connect": "Slides show both contagious and hierarchical diffusion; AMSCO's table adds relocation to Europe and the US in recent decades.", "mem": "Buddhism = Buddha, universalizing.", "conf": "Hinduism", "watch": ""}, {"sec": "3.7 Religion", "term": "Sikhism", "core": 1, "plain": "Universalizing monotheistic religion founded by Guru Nanak in Punjab in the 16th century; worship in a gurdwara.", "dq": ["AMSCO p.177", "Sikhism was founded by Guru Nanak in the Punjab region that crosses the border of India and Pakistan during the 16th century."], "ax": ["A Sikh's place of worship is called a gurdwara, and every gurdwara has a food kitchen serving all faiths.", "AMSCO p.177", "A Sikh's place of worship is called a gurdwara"], "nx": ["Your slide lists Sikhism among universalizing religions.", "Slides 3.7.2", "Examples: Christianity, Islam, Buddhism, Sikhism"], "connect": "AMSCO calls it universalizing but with limited geographic diffusion.", "mem": "Sikh = Singh and Kaur names, gurdwara.", "conf": "", "watch": ""}, {"sec": "3.7 Religion", "term": "Judaism", "core": 1, "plain": "Ethnic, monotheistic religion from the eastern Mediterranean; Torah; spread by relocation (Diaspora).", "dq": ["AMSCO p.178", "Judaism was among the first monotheistic faiths."], "ax": ["In 1948 the country of Israel was formed and Jews from around the world migrated there.", "AMSCO p.178", "In 1948, the country of Israel was formed."], "nx": ["Your slide: Abraham founded the religion; forced relocation during the Roman Empire, the Crusades, 19th-century Russia and the Holocaust.", "Slides 3.7.2", "Abraham was a prophet and founded the religion."], "connect": "Slides and AMSCO both show relocation diffusion driven by persecution (the Diaspora).", "mem": "Judaism = ethnic, Diaspora.", "conf": "", "watch": ""}, {"sec": "3.7 Religion", "term": "Christianity", "core": 1, "plain": "Universalizing religion that began with followers of Jesus; branches Roman Catholic, Protestant, Eastern Orthodox; spread by missionaries, rulers and colonialism.", "dq": ["AMSCO p.178", "Christianity began when followers of a Jewish teacher, Jesus"], "ax": ["There are three main branches: Roman Catholic, Protestant and Eastern Orthodox.", "AMSCO p.178", "There are three main branches of Christianity-Roman Catholic, Protestant and Eastern Orthodox"], "nx": ["Your slide: Emperor Theodosius made it the Roman Empire's official religion (hierarchical).", "Slides 3.7.2", "declared Christianity the official religion of the Roman Empire."], "connect": "Contagious (disciples), hierarchical (Theodosius, rulers) and relocation/colonialism — all three patterns apply.", "mem": "Christianity = 3 branches, all diffusion types.", "conf": "", "watch": ""}, {"sec": "3.7 Religion", "term": "Islam", "core": 1, "plain": "Universalizing monotheistic religion; Allah, Muhammad, the Quran, Five Pillars; Sunni and Shia; fastest growing by natural increase.", "dq": ["AMSCO p.179", "Islam is the religion followed by Muslims."], "ax": ["Today Islam is the fastest-growing religion in the world based on natural increase.", "AMSCO p.179", "Today, Islam is the fastest growing religion in the world based on natural increase."], "nx": ["Your slide: Indonesia has the largest number of Muslims in the world; spread by traders and by empires.", "Slides 3.7.2", "Indonesia has the largest number of Muslims in the world."], "connect": "AMSCO and slide agree it spread by conquest and trade; AMSCO adds pilgrimage (the hajj to Mecca).", "mem": "Islam = Allah, Quran, Five Pillars.", "conf": "", "watch": "Your slide says Muhammad is the “grandson of Abraham.” AMSCO places Abraham around 1800 B.C.E. and Muhammad in the 6th–7th centuries C.E. — use AMSCO's dates."}, {"sec": "3.8 Effects", "term": "Acculturation", "core": 0, "plain": "Adopting values and practices of the larger society while keeping valuable parts of your own culture.", "dq": ["AMSCO p.182", "Often, an ethnic or immigrant group moving to a new area adopts the values and practices of the larger group that has received them, while still maintaining valuable elements of their own culture."], "ax": ["Danish family in Iowa: descendants still ate abelskivver but had names like Susan, Jim and Dave.", "AMSCO p.182", "Within three generations, their descendants still ate abelskivver, but they had names common in U.S. culture"], "nx": ["Your slide: a Guatemalan immigrant speaks Spanish at home and English in public.", "Slides 3.8", "Prolonged contact between two or more cultures may result in acculturation which is when people within one culture adopt some traits from the other culture."], "connect": "Both define acculturation as adopting some traits while keeping others — this is why immigrants are often multilingual.", "mem": "Acculturation = add on (keep your own).", "conf": "assimilation (fully absorbed)", "watch": ""}, {"sec": "3.8 Effects", "term": "Assimilation", "core": 0, "plain": "An ethnic group can no longer be distinguished from the receiving group.", "dq": ["AMSCO p.183", "Unlike acculturation, assimilation happens when an ethnic group can no longer be distinguished from the receiving group."], "ax": ["Complete assimilation rarely happens; religion is usually the trait retained longest.", "AMSCO p.183", "Usually, the one trait that is retained the longest is religion."], "nx": ["Your slide: Native American boarding schools forced children to learn English, cut their hair and change clothing.", "Slides 3.8", "NAs were forced to learn English, cut their hair, change their clothing"], "connect": "Assimilation can be voluntary or forced. The boarding-school example (1890s–1960s) is forced.", "mem": "Assimilation = absorbed completely.", "conf": "acculturation", "watch": "Your slide calls assimilation a “subtype of acculturation.” AMSCO says “Unlike acculturation.” Both agree assimilation means abandoning the original culture; use your teacher's wording on her test function pool(i){const t=TS[i];let p=TS.map((x,j)=>j).filter(j=>j!==i&&!bad(t.term,TS[j].term)&&TS[j].term!==t.term);
 const same=p.filter(j=>TS[j].sec===t.sec),other=p.filter(j=>TS[j].sec!==t.sec);
 return shuf(same).concat(shuf(other))}
function genQ(i,kind){
 const t=TS[i];if(kind==='ex'&&(!t.ax||leaks(t,t.ax[0])))kind='def';
 if(kind==='def'&&leaks(t,t.plain))kind='term';
 const d=pool(i).slice(0,4);
 let opts,q;
 if(kind==='def'){q='Which term matches this definition?<br><i>'+t.plain+'</i>';opts=[{t:t.term,ok:true},...d.map(j=>({t:TS[j].term,ok:false}))]}
 else if(kind==='ex'){q='Which term does this example show?<br><i>'+t.ax[0]+'</i>';opts=[{t:t.term,ok:true},...d.map(j=>({t:TS[j].term,ok:false}))]}
 else{q='What does <b>'+t.term+'</b> mean?';opts=[{t:t.plain,ok:true},...d.map(j=>({t:TS[j].plain,ok:false}))]}
 return {i,kind,q,opts:shuf(opts)}}
function feedback(Qn,good){const t=TS[Qn.i];
 const b=H('div');b.append(H('div',{class:'exp '+(good?'ok':'no')},H('b',{},good?'Correct! ':'Not quite. '),H('span',{html:'<b>'+t.term+'</b>: '+t.plain})),srcBox(t.dq[0],t.dq[1]));
 if(t.ax)b.append(H('p',{html:'<b>AMSCO example:</b> '+t.ax[0]}));
 if(t.nx)b.append(H('p',{html:'<b>Notes example:</b> '+t.nx[0]}));
 b.append(H('p',{html:'<b>Hook:</b> '+t.mem}));if(t.conf)b.append(H('p',{html:'<b>Don\'t confuse with:</b> '+t.conf}));if(t.watch)b.append(H('div',{class:'watch',html:'<b>⚠</b> '+t.watch}));return b}
/* ---------- QUIZ ---------- */
let qz=null;
function quiz(){
 const el=$('#s-quiz');el.innerHTML='';
 const sec=H('select',{'aria-label':'Section'},['All',...sections].map(s=>H('option',{value:s},s)));
 const kind=H('select',{'aria-label':'Question type'},[['mix','Mixed'],['def','Definition → term'],['term','Term → definition'],['ex','Example → term']].map(([v,l])=>H('option',{value:v},l)));
 const scope=H('select',{'aria-label':'Scope'},[['all','All terms'],['core','Template terms only'],['unm','Not yet mastered']].map(([v,l])=>H('option',{value:v},l)));
 const box=H('div');
 el.append(H('div',{class:'row'},H('label',{class:'f'},'Section',sec),H('label',{class:'f'},'Type',kind),H('label',{class:'f'},'Terms',scope)),box);
 const next=()=>{let idx=TS.map((t,i)=>i).filter(i=>(sec.value==='All'||TS[i].sec===sec.value)&&(scope.value!=='core'||TS[i].core)&&(scope.value!=='unm'||mastery(i)!=='mastered'));
  if(!idx.length){box.innerHTML='';box.append(H('div',{class:'card'},'Everything in this filter is mastered. 🎉'));return}
  const i=idx[Math.floor(Math.random()*idx.length)];const k=kind.value==='mix'?['def','term','ex'][Math.floor(Math.random()*3)]:kind.value;
  qz=genQ(i,k);draw()};
 function draw(){box.innerHTML='';const card=H('div',{class:'card'});const fb=H('div');let done=false;
  card.append(H('div',{},H('span',{class:'pill'},TS[qz.i].sec)),H('h3',{html:qz.q,style:'margin-top:8px'}));
  qz.opts.forEach((o,j)=>{const b=H('button',{class:'opt',type:'button'},H('span',{class:'l'},LET[j]),H('span'));b.lastChild.textContent=o.t;
   b.onclick=()=>{if(done)return;done=true;card.querySelectorAll('.opt').forEach((bb,x)=>{bb.disabled=true;if(qz.opts[x].ok)bb.classList.add('ok')});if(!o.ok)b.classList.add('no');bump(qz.i,o.ok);fb.append(feedback(qz,o.ok));nb.hidden=false};card.append(b)});
  const nb=H('button',{class:'btn',onclick:next},'Next question →');nb.hidden=true;
  card.append(fb,H('div',{class:'row',style:'margin-top:12px'},nb));
  const m=S.m[qz.i];box.append(H('p',{class:'sub'},'Mastery of this term: '+mastery(qz.i)+(m?' ('+m.r+' right, '+m.w+' wrong)':'')),card)}
 [sec,kind,scope].forEach(x=>x.onchange=next);next()}
/* ---------- MATCH ---------- */
function match(){
 const el=$('#s-match');el.innerHTML='';
 const sec=H('select',{'aria-label':'Section'},['All',...sections].map(s=>H('option',{value:s},s)));
 const core=H('input',{type:'checkbox'});const box=H('div');
 el.append(H('div',{class:'row'},H('label',{class:'f'},'Section',sec),H('label',{class:'f'},'Template terms only',core)),box);
 function set(){box.innerHTML='';
  let idx=shuf(TS.map((t,i)=>i).filter(i=>(sec.value==='All'||TS[i].sec===sec.value)&&(!core.checked||TS[i].core)&&TS[i].plain.length<150));
  const pick=[];for(const i of idx){if(pick.length>=6)break;if(pick.every(p=>!bad(TS[p].term,TS[i].term)&&!leaks(TS[i],TS[i].plain)))pick.push(i)}
  if(pick.length<2){box.append(H('div',{class:'card'},'Not enough terms in this filter.'));return}
  const L=H('div'),R=H('div');let selL=null,right=0,tries=0;
  const status=H('p',{class:'sub'},'Click a term, then its definition.');
  const bl=pick.map(i=>H('button',{type:'button'},TS[i].term));const br=shuf(pick).map(i=>{const b=H('button',{type:'button',html:TS[i].plain});b.dataset.i=i;return b});
  bl.forEach((b,k)=>{b.dataset.i=pick[k];b.onclick=()=>{if(b.classList.contains('done'))return;bl.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selL=b}});
  br.forEach(b=>b.onclick=()=>{if(!selL||b.classList.contains('done'))return;tries++;
   if(selL.dataset.i===b.dataset.i){selL.classList.remove('sel');selL.classList.add('done');b.classList.add('done');bump(+b.dataset.i,true);right++;selL=null;status.textContent=right===pick.length?'All matched in '+tries+' tries!':'Correct!'}
   else{bump(+selL.dataset.i,false);b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),500);status.textContent='Not that one — try again.'}});
  box.append(status,H('div',{class:'mt'},H('div',{},bl),H('div',{},br)),H('div',{class:'row',style:'margin-top:12px'},H('button',{class:'btn',onclick:set},'New set')))}
 sec.onchange=set;core.onchange=set;set()}
/* ---------- TEST ---------- */
let T=null;
function test(){
 const el=$('#s-test');el.innerHTML='';
 if(T&&!T.done)return drawTest();
 const n=H('select',{id:'tn'},[['20','20 questions'],['40','40 questions'],['60','60 questions'],['all','All terms']].map(([v,l])=>H('option',{value:v},l)));n.value='40';
 const sc=H('select',{id:'ts'},[['all','Everything'],['core','Template terms only'],['weak','My weak spots (not mastered)']].concat(sections.map(s=>[s,s])).map(([v,l])=>H('option',{value:v},l)));
 el.append(H('div',{class:'card'},H('h2',{},'Take a test'),H('p',{},'Mixed question types, shuffled options, no hints until you submit.'),
  H('div',{class:'row'},H('label',{class:'f'},'Length',n),H('label',{class:'f'},'Scope',sc),H('button',{class:'btn',onclick:()=>{
   let idx=TS.map((t,i)=>i).filter(i=>sc.value==='all'||(sc.value==='core'&&TS[i].core)||(sc.value==='weak'&&mastery(i)!=='mastered')||TS[i].sec===sc.value);
   if(!idx.length){let m=$('#tmsg');if(!m){m=H('p',{id:'tmsg',class:'hint'});$('#s-test .card').append(m)}m.textContent='Nothing in that scope — pick another.';return}
   idx=shuf(idx);if(n.value!=='all')idx=idx.slice(0,+n.value);
   T={items:idx.map(i=>({q:genQ(i,['def','term','ex'][Math.floor(Math.random()*3)]),pick:null})),i:0,done:false};drawTest()}},'Start test'))),
  S.tests.length?H('div',{class:'card'},H('h3',{},'Past tests'),H('table',{html:'<tr><th>Date</th><th>Score</th><th>Questions</th></tr>'+S.tests.slice(-8).reverse().map(t=>'<tr><td>'+t.date+'</td><td>'+t.pct+'%</td><td>'+t.total+'</td></tr>').join('')})):'')}
function drawTest(){
 const el=$('#s-test');el.innerHTML='';const it=T.items[T.i],q=it.q;
 const card=H('div',{class:'card'},H('p',{class:'sub'},'Question '+(T.i+1)+' of '+T.items.length),H('h3',{html:q.q}));
 q.opts.forEach((x,i)=>{const b=H('button',{class:'opt'+(it.pick===i?' sel':''),type:'button',onclick:()=>{it.pick=i;drawTest()}},H('span',{class:'l'},LET[i]),H('span'));b.lastChild.textContent=x.t;card.append(b)});
 const answered=T.items.filter(x=>x.pick!==null).length;
 card.append(H('div',{class:'row',style:'margin-top:12px'},
  H('button',{class:'btn sec',onclick:()=>{if(T.i>0){T.i--;drawTest()}}},'← Back'),
  T.i<T.items.length-1?H('button',{class:'btn',onclick:()=>{T.i++;drawTest()}},'Next →'):H('button',{class:'btn',onclick:finish},'Submit test'),
  H('button',{class:'btn sec',onclick:finish},'Submit early ('+answered+'/'+T.items.length+' answered)')));
 el.append(H('div',{class:'bar'},H('i',{style:'width:'+Math.round(100*answered/T.items.length)+'%'})),card)}
function finish(){
 T.done=true;let right=0;const bySec={};
 T.items.forEach(it=>{const ok=it.pick!==null&&it.q.opts[it.pick].ok;if(ok)right++;const s=TS[it.q.i].sec;const g=bySec[s]||(bySec[s]={r:0,n:0});g.n++;if(ok)g.r++;bump(it.q.i,ok)});
 const pct=Math.round(100*right/T.items.length);S.tests.push({date:new Date().toLocaleString(),pct,total:T.items.length});save();
 const el=$('#s-test');el.innerHTML='';
 const msg=pct>=90?'Excellent — you are ready.':pct>=75?'Good. Review the misses below, then retest.':'Keep going: use Terms + Flashcards on the misses, then retake.';
 const wrong=T.items.filter(it=>!(it.pick!==null&&it.q.opts[it.pick].ok));
 el.append(H('div',{class:'card'},H('h2',{},'Score: '+right+' / '+T.items.length+' ('+pct+'%)'),H('p',{},msg),
  H('table',{html:'<tr><th>Section</th><th>Correct</th></tr>'+Object.entries(bySec).map(([k,v])=>'<tr><td>'+k+'</td><td>'+v.r+' / '+v.n+'</td></tr>').join('')}),
  H('div',{class:'row',style:'margin-top:12px'},H('button',{class:'btn',onclick:()=>{T=null;test()}},'New test'),
   H('button',{class:'btn sec',onclick:()=>{if(!wrong.length)return;T={items:wrong.map(it=>({q:genQ(it.q.i,it.q.kind),pick:null})),i:0,done:false};drawTest()}},'Retry my misses'))));
 el.append(H('h2',{},wrong.length?'Review your misses ('+wrong.length+')':'No misses!'));
 wrong.forEach(it=>{const c=it.q.opts.findIndex(x=>x.ok);
  const card=H('div',{class:'card'},H('h3',{html:it.q.q}),H('p',{},'Your answer: '+(it.pick===null?'(blank)':LET[it.pick]+'. '+it.q.opts[it.pick].t)),H('p',{},'Correct: '+LET[c]+'. '+it.q.opts[c].t),feedback(it.q,true));
  card.querySelector('.exp').classList.remove('ok');el.append(card)})}
/* ---------- COMPARE ---------- */
function compare(){
 const el=$('#s-compare');el.innerHTML='';
 el.append(H('p',{},'These match the template column “How are these examples connected?” Write your answer, then compare with the model and tick what you included.'));
 D.W.forEach((q,n)=>{
  const ta=H('textarea',{'aria-label':'Your answer'});ta.value=(S.wr[n]&&S.wr[n].txt)||'';ta.oninput=()=>{S.wr[n]=S.wr[n]||{};S.wr[n].txt=ta.value;save()};
  const hb=H('div'),mb=H('div');
  el.append(H('div',{class:'card'},H('p',{class:'sub'},'Prompt '+(n+1)+' of '+D.W.length),H('h3',{html:q.q}),ta,hb,mb,
   H('div',{class:'row',style:'margin-top:10px'},
    H('button',{class:'btn sec',onclick:()=>{hb.innerHTML='';hb.append(H('div',{class:'hint',html:'<b>Hint:</b> '+q.hint}))}},'💡 Hint'),
    H('button',{class:'btn',onclick:()=>{mb.innerHTML='';mb.append(H('div',{class:'exp',html:'<b>Model answer:</b> '+q.model}),H('div',{class:'card'},H('b',{},'Did you include:'),q.points.map((p,i)=>{const id='c'+n+'_'+i;return H('div',{},H('input',{type:'checkbox',id}),' ',H('label',{for:id},p))})),srcBox(q.src,q.quote))}},'Show model answer'))))})}
/* ---------- COVERAGE / PROGRESS ---------- */
function progress(){
 const el=$('#s-progress');el.innerHTML='';
 const core=TS.filter(t=>t.core).length;
 el.append(H('div',{class:'card'},H('h2',{},'Coverage'),
  H('p',{html:'<b>'+core+' of 48</b> terms from your Unit 3 Vocabulary Study Template are in this guide, plus <b>'+(TS.length-core)+'</b> bonus terms (AMSCO key terms and slide-only terms). Every definition and example is backed by an exact source quote that was machine-checked against the AMSCO text, your packet and your slides.'}),
  H('p',{},'Sources read: AMSCO book pp. 131–189 (Topics 3.1–3.8), Student Notes Packet, slide decks 3.1, 3.3, 3.4, 3.5, 3.6, 3.7, 3.7.2 and 3.8, and the Digital Workbook.')));
 sections.forEach(sec=>{const rows=TS.map((t,i)=>({t,i})).filter(({t})=>t.sec===sec);
  el.append(H('div',{class:'card'},H('h3',{},sec),H('table',{html:'<tr><th>Term</th><th>Template?</th><th>Status</th><th>Right / Wrong</th></tr>'+rows.map(({t,i})=>{const m=S.m[i]||{r:0,w:0};return '<tr><td>'+t.term+'</td><td>'+(t.core?'✓':'bonus')+'</td><td>'+mastery(i)+'</td><td>'+m.r+' / '+m.w+'</td></tr>'}).join('')})))});
 el.append(H('div',{class:'note',html:'<b>Where your sources disagree (know both):</b><ul>'+TS.filter(t=>t.watch).map(t=>'<li><b>'+t.term+':</b> '+t.watch+'</li>').join('')+'</ul>'}))}
