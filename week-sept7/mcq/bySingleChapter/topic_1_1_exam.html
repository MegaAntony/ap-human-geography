  },
  {
    "id": "1.1-Q25",

    "amscoReference": {
      "textbook": "Advanced Placement Human Geography, 2nd Edition",
      "author": "David L. Palmer",
      "unit": "Unit 1: Thinking Geographically",
      "chapter": "Topic 1.1: Introduction to Maps",
      "section": "Thematic Maps: Choropleth Maps and Classification",
      "whereToLook": "AMSCO 2nd Ed, Topic 1.1, under 'Thematic Maps: Choropleth Maps'"
    },
    "stimulus": null,
    "question": "An economic development analyst uses five distinct shading gradations from light yellow to dark purple to illustrate municipal median home values across a metropolitan region. Which type of map is being utilized?",
    "options": [
      {
        "id": "A",
        "text": "An isoline map that connects points of equal value using continuous curved contour lines.",
        "isCorrect": false
      },

let userAnswers = {};
let score = 0;

function renderQuiz() {
  const container = document.getElementById('quizForm');
  container.innerHTML = '';

  examQuestions.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'card-' + idx;

    const meta = document.createElement('div');
    meta.className = 'q-meta';
    meta.innerHTML = '<span class="skill-pill">' + q.skill + '</span> ' +
      '<span class="amsco-pill">AMSCO: ' + q.amscoReference.section + '</span>';
    card.appendChild(meta);

    if (q.stimulus) {
      const stim = document.createElement('div');
      stim.className = 'q-stimulus';
      stim.innerHTML = '<strong>Stimulus:</strong> ' + q.stimulus;
      card.appendChild(stim);
    }

    const prompt = document.createElement('div');
    prompt.className = 'q-prompt';
    prompt.textContent = (idx + 1) + '. ' + q.question;
    card.appendChild(prompt);

    const optGrid = document.createElement('div');
    optGrid.className = 'options-grid';

    q.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerHTML = '<strong>(' + opt.id + ')</strong> ' + opt.text;
      btn.onclick = () => selectAnswer(idx, opt.id);
      optGrid.appendChild(btn);
    });
    card.appendChild(optGrid);

    const feedback = document.createElement('div');
    feedback.className = 'feedback-box';
    feedback.id = 'fb-' + idx;
    card.appendChild(feedback);

    container.appendChild(card);
  });
}

function selectAnswer(qIdx, selectedOptId) {
  if (userAnswers[qIdx] !== undefined) return;
  userAnswers[qIdx] = selectedOptId;

  const q = examQuestions[qIdx];
  const isCorrect = (selectedOptId === q.correctAnswer);
  if (isCorrect) score++;

  const card = document.getElementById('card-' + qIdx);
  const buttons = card.querySelectorAll('.opt-btn');

  buttons.forEach((btn, bIdx) => {
    btn.disabled = true;
    const opt = q.options[bIdx];
    if (opt.id === q.correctAnswer) {
      btn.classList.add('correct');
    } else if (opt.id === selectedOptId && !isCorrect) {
      btn.classList.add('wrong');
    }
  });

  const fb = document.getElementById('fb-' + qIdx);
  fb.className = 'feedback-box show ' + (isCorrect ? 'correct' : 'wrong');

  let distractorNote = '';
  if (!isCorrect && q.explanation.distractors && q.explanation.distractors[selectedOptId]) {
    distractorNote = '<p style="margin-top:6px; color:#c5221f;"><strong>Why (' + selectedOptId + ') is incorrect:</strong> ' + q.explanation.distractors[selectedOptId] + '</p>';
  }

  fb.innerHTML = '<strong>' + (isCorrect ? '✓ Correct!' : '✗ Incorrect. Correct Answer is (' + q.correctAnswer + ')') + '</strong>' +
    '<p style="margin:4px 0;">' + q.explanation.summary + '</p>' +
    distractorNote +
    '<p style="margin-top:6px; font-size:12px; color:#64748b;"><strong>Where to find this in textbook:</strong> ' + q.amscoReference.whereToLook + '</p>';

  updateTracker();
}

function updateTracker() {
  const answeredCount = Object.keys(userAnswers).length;
  const pct = answeredCount > 0 ? Math.round((score / answeredCount) * 100) : 0;
  document.getElementById('scoreTracker').textContent = 'Score: ' + score + ' / ' + answeredCount + ' answered (' + pct + '%)';
}

renderQuiz();
</script>
