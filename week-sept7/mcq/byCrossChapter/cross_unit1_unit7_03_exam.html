let answeredCount = 0;
let totalScore = 0;

function renderExam() {
  const container = document.getElementById("quizForm");
  container.innerHTML = "";

  examQuestions.forEach((q, idx) => {
    const qNum = idx + 1;
    const card = document.createElement("div");
    card.className = "q-card";
    card.id = `card-q${qNum}`;

    let imageHtml = q.image ? `<div style="text-align:center; margin:14px 0;"><img src="${q.image}" style="max-width:100%; max-height:420px; border-radius:6px; border:1px solid #cbd5e1; box-shadow:0 2px 8px rgba(0,0,0,0.06);" alt="Stimulus Graphic" /></div>` : "";
    let stimulusHtml = "";
    if (q.stimulus) {
      stimulusHtml = `${imageHtml}<div class="q-stimulus"><strong>Stimulus:</strong> ${q.stimulus}</div>`;
    } else if (imageHtml) {
      stimulusHtml = imageHtml;
    }

    let optsHtml = q.options.map(opt => `
      <button class="opt-btn" id="btn-q${qNum}-${opt.id}" onclick="handleAnswer(${idx}, '${opt.id}', ${qNum})">
        <strong>(${opt.id})</strong> ${opt.text}
      </button>
    `).join("");

    card.innerHTML = `
      <div class="q-meta">
        <span class="skill-pill">${q.skill}</span>
        <span class="topic-pill">${q.topic}</span>
        <span class="amsco-pill">${q.amscoReference.chapter} &bull; ${q.amscoReference.section}</span>
      </div>
      ${stimulusHtml}
      <div class="q-prompt"><strong>Question ${qNum}:</strong> ${q.question}</div>
      <div class="options-grid" id="opts-q${qNum}">
        ${optsHtml}
      </div>
      <div class="feedback-box" id="feedback-${qNum}"></div>
    `;
    container.appendChild(card);
  });
}

function handleAnswer(qIdx, choiceId, qNum) {
  answeredCount++;
  const q = examQuestions[qIdx];
  const isCorrect = (choiceId === q.correctAnswer);
  if (isCorrect) totalScore++;

  // Disable buttons & style
  q.options.forEach(opt => {
    const btn = document.getElementById(`btn-q${qNum}-${opt.id}`);
    btn.disabled = true;
    if (opt.id === q.correctAnswer) {
      btn.classList.add("correct");
    } else if (opt.id === choiceId) {
      btn.classList.add("wrong");
    }
  });

  // Display rationale
  const fb = document.getElementById(`feedback-${qNum}`);
  fb.className = "feedback-box show " + (isCorrect ? "correct" : "wrong");

  let distractorsHtml = "";
  if (!isCorrect && q.explanation.distractors[choiceId]) {
    distractorsHtml = `<div style="margin-top: 8px; font-weight: 500;"><strong>Why (${choiceId}) is incorrect:</strong> ${q.explanation.distractors[choiceId]}</div>`;
  }

  fb.innerHTML = `
    <strong>${isCorrect ? "Correct!" : "Incorrect — Correct Answer is (" + q.correctAnswer + ")"}</strong>
    <div>${q.explanation.summary}</div>
    ${distractorsHtml}
    <div style="margin-top: 8px; font-size: 12px; color: #475569;">
      📖 <em>Reference: ${q.amscoReference.whereToLook}</em>
    </div>
  `;

  // Update score
  const pct = Math.round((totalScore / answeredCount) * 100);
  document.getElementById("scoreTracker").innerText = `Score: ${totalScore} / ${answeredCount} answered (${pct}%)`;
}

renderExam();
</script>
