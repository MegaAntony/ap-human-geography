or reinforces roles (e.g., gender-segregated schools in Pakistan; women-only areas in Iran/India).", "points": ["Lists the six landscape elements", "Identifies photo number", "Connects evidence to gender roles or gendered space"], "hint": "Physical, ag/industrial, religion/language, sequent occupancy, architecture, land use.", "src": "Workbook", "quote": "Agriculture & Industrial practices", "note": "", "id": 111}, {"t": "sa", "topic": "3.3", "tag": "gender", "f": ["F67"], "q": "Explain how <b>religious fundamentalism</b> can affect women, and how distance decay changes it.", "model": "Fundamentalists follow a literal interpretation and live traditional lifestyles; in some traditions women are likely to leave school young, live in arranged marriage, and avoid working outside the home. Fundamentalism often weakens with distance from the hearth (distance decay): Islamic fundamentalism is strongest on the Arabian Peninsula (Sharia strongest in Saudi Arabia and Yemen) and less in Malaysia and Indonesia.", "points": ["Definition", "Effect on women (education, marriage, work)", "Distance decay with example"], "hint": "Definition → effect on women → distance decay.", "src": "AMSCO p.152", "quote": "The strength of fundamentalism often diminishes with greater distance from the religious hearth", "note": "", "id": 112}, {"t": "sa", "topic": "3.1", "tag": "gender", "f": ["F19", "F24"], "q": "Using <b>cultural relativism</b>, explain how a geographer should respond to an unfamiliar gender-related custom (for example, the Suri lip plate).", "model": "The geographer should not judge by their own standards (ethnocentrism) but understand the custom from the Suri perspective: the lip plate is a sign of beauty and tied to marriage customs; larger plates relate to dowry (slides). Cultural relativism seeks to understand why a practice exists within that culture’s history and environment.", "points": ["Names ethnocentrism vs relativism", "Uses the slide example", "Explains understanding in context"], "hint": "Understand first, judge later.", "src": "AMSCO p.152", "quote": "A counter to ethnocentric views has been cultural relativism", "note": "", "id": 113}, {"t": "sa", "topic": "3.2", "tag": "ethnicity", "f": ["F35", "F49", "F51"], "q": "Explain how ethnicity shows on the cultural landscape. Use <b>two</b> terms.", "model": "Examples: ethnic enclaves (Chinatown, Little Mogadishu) with stores, religious institutions, signs in traditional language and architecture; ethnic islands in rural areas (Amish, Mennonites); sequent occupancy in neighborhoods like Harlem and Pilsen leaving layers of imprint.", "points": ["Two correct terms", "A specific example for each", "Landscape evidence"], "hint": "Enclave, island, sequent occupancy, charter group.", "src": "AMSCO p.140", "quote": "Inside these enclaves are often stores and religious institutions that", "note": "", "id": 114}, {"t": "sa", "topic": "3.3", "tag": "forces", "f": ["F64", "F65"], "q": "Describe one <b>centripetal</b> and one <b>centrifugal</b> force with an example for each.", "model": "Centripetal: shared language/religion, shared heritage, fair legal system, charismatic leader; e.g., American holiday season or Christmas tree. Centrifugal: different languages/religions, ethnic conflict, racism; e.g., Northern Ireland (Catholic vs. Anglican) or Iraq (Shiite/Sunni/Kurds).", "points": ["Correct definitions", "Example for each", "Explains unify vs divide"], "hint": "Pull toward center vs. pull apart.", "src": "AMSCO p.150", "quote": "Centripetal forces are those that unify a group of people or a region.", "note": "", "id": 115}, {"t": "tf", "topic": "3.1", "tag": "gender", "f": ["F23"], "q": "TRUE or FALSE: Your teacher's slides classify <b>gender roles</b> as a sociofact.", "ans": true, "hint": "Sociofacts = how society organizes itself.", "exp": "True. Sociofacts include family, school, government, religion, land use and gender roles — ways a society behaves and organizes institutions.", "src": "Slides 3.1", "quote": "Religion - Land Use - Gender Roles", "id": 116}, {"t": "tf", "topic": "3.2", "tag": "gender", "f": ["F36"], "q": "TRUE or FALSE: In folk cultures women usually handle domestic responsibilities such as farming, educating children and caring for family.", "ans": true, "hint": "Page 141, Geography of Gender.", "exp": "True — and men often work outside the house earning money and serve as leaders in religion and politics.", "src": "AMSCO p.141", "quote": "Women usually handle the domestic responsibilities", "id": 117}, {"t": "tf", "topic": "3.2", "tag": "gender", "f": ["F40"], "q": "TRUE or FALSE: As countries become more developed, women gain more access to education, the workforce, and property rights.", "ans": true, "hint": "Your packet \"Role of Women\".", "exp": "True — this is why landscapes and gender roles change with development.", "src": "Packet 3.2", "quote": "As countries become more economically and socially developed, women have access to more education, the workforce, and property rights.", "id": 118}, {"t": "tf", "topic": "3.2", "tag": "gender", "f": ["F41"], "q": "TRUE or FALSE: Your packet says 19% of women surveyed in Mexico City feel very safe in transport.", "ans": true, "hint": "Remember the number.", "exp": "True. It is a data point about a gendered space issue: how safe women feel using public transport.", "src": "Packet 3.2", "quote": "Mexico City: 19% of women surveyed reported that they feel very safe in transport.", "id": 119}, {"t": "tf", "topic": "3.2", "tag": "gender", "f": ["F39"], "q": "TRUE or FALSE: Gendered spaces exist only inside private homes.", "ans": false, "hint": "Think of parks, restaurants, schools and transit.", "exp": "False. The book's examples include men-only/women-only restaurants and parks in Iran and India (and Pakistan's gender-segregated schools). Homes are just one scale.", "src": "AMSCO p.141", "quote": "In Iran and India, some restaurants and parks are designated", "id": 120}, {"t": "tf", "topic": "3.3", "tag": "gender", "f": ["F67"], "q": "TRUE or FALSE: Fundamentalism gets stronger the farther you are from the religious hearth.", "ans": false, "hint": "Distance decay.", "exp": "False. It often diminishes with distance from the hearth (distance decay). Example: less prevalent in Malaysia and Indonesia than in the Arabian Peninsula.", "src": "AMSCO p.152", "quote": "The strength of fundamentalism often diminishes with greater distance from the religious hearth", "id": 121}, {"t": "tf", "topic": "3.3", "tag": "attitudes", "f": ["F68"], "q": "TRUE or FALSE: Ethnocentrism may lead to centrifugal forces within a state, such as discrimination and intolerance.", "ans": true, "hint": "We vs. them.", "exp": "True. A “we versus them” mentality can fuel division within a state and tension between states.", "src": "AMSCO p.152", "quote": "Ethnocentrism may lead to centrifugal forces within a state", "id": 122}, {"t": "tf", "topic": "3.1", "tag": "culture", "f": ["F19"], "q": "TRUE or FALSE: Cultural relativism means believing your own culture is superior to others.", "ans": false, "hint": "That is ethnocentrism.", "exp": "False. Cultural relativism is an unbiased way of viewing another culture to promote understanding. Believing yours is better is ethnocentrism.", "src": "Slides 3.1", "quote": "Cultural Relativism: An unbiased way of viewing another culture", "id": 123}, {"t": "tf", "topic": "3.2", "tag": "ethnicity", "f": ["F35"], "q": "TRUE or FALSE: Ethnic enclaves can provide a buffer against discrimination and a network for jobs.", "ans": true, "hint": "Why people cluster.", "exp": "True — they also often contain stores, religious institutions and signs in a traditional language.", "src": "AMSCO p.141", "quote": "a buffer against discrimination by the dominant culture", "id": 124}, {"t": "tf", "topic": "3.2", "tag": "ethnicity", "f": ["F51"], "q": "TRUE or FALSE: Sequent occupancy means only the first group to live in a place leaves a cultural imprint.", "ans": false, "hint": "Layers over time.", "exp": "False. Each group leaves imprints, contributing to the cultural landscape over time (e.g., Harlem).", "src": "Packet 3.2", "quote": "each contributing to the overall cultural landscape over time", "id": 125}, {"t": "tf", "topic": "3.2", "tag": "landscape", "f": ["F34"], "q": "TRUE or FALSE: Postmodern architecture is mainly adobe or wooden homes from local materials.", "ans": false, "hint": "Think steel and glass.", "exp": "False — that describes traditional architecture. Postmodern is high rises of steel and glass siding.", "src": "AMSCO p.140", "quote": "toward high rise structures made from large amounts of steel and glass siding", "id": 126}, {"t": "tf", "topic": "3.3", "tag": "forces", "f": ["F64"], "q": "TRUE or FALSE: A charismatic leader can be a centripetal force.", "ans": true, "hint": "Unifying aspects of culture.", "exp": "True — along with common language/religion, shared heritage, ethnic unity and a fair legal system.", "src": "AMSCO p.150", "quote": "a charismatic leader", "id": 127}], "C": [{"sec": "Gender (start here)", "term": "Gender roles (a sociofact)", "plain": "The jobs, duties and expectations a society assigns to men and women. Because they describe how a society organizes itself, your teacher files them under <b>sociofacts</b>.", "ex": "Who farms, who raises children, who leads at the temple.", "src": "Slides 3.1", "quote": "Religion - Land Use - Gender Roles", "f": ["F23"]}, {"sec": "Gender (start here)", "term": "Folk culture gender roles", "plain": "In small, rural, slow-changing cultures, roles are clearly defined: women handle domestic work; men earn money outside the home and lead in religion and politics.", "ex": "A village where mother farms and raises children while father is the religious and political leader.", "src": "AMSCO p.141", "quote": "In folk cultures, people often have clearly defined gender-specific roles.", "f": ["F36"]}, {"sec": "Gender (start here)", "term": "Popular culture gender roles", "plain": "Roles are challenged. More education → more jobs outside the home → more economic power → more chances to lead.", "ex": "A city where women study, work in offices and run companies.", "src": "AMSCO p.141", "quote": "In popular culture, traditional gender-specific roles are challenged.", "f": ["F37"]}, {"sec": "Gender (start here)", "term": "Well vs. weakly defined roles", "plain": "The AMSCO comparison table: traditional culture = <b>well-defined</b> gender roles; popular/global culture = <b>weakly defined</b> gender roles.", "ex": "Use these exact words in short answers.", "src": "AMSCO p.136", "quote": "Weakly defined gender roles", "f": ["F15"]}, {"sec": "Gender (start here)", "term": "Gendered space (gendered landscape)", "plain": "A place in the cultural landscape used to reinforce or accommodate gender roles. It shows how cultural values distribute power.", "ex": "Gender-segregated schools in Pakistan; men-only/women-only parks in Iran and India; rooms in a home.", "src": "Packet 3.2", "quote": "Gendered Spaces: Places in the cultural landscape utilized to reinforce or accommodate gender roles for men and women.", "f": ["F38"]}, {"sec": "Gender (start here)", "term": "Public vs. private spaces", "plain": "Men have commonly operated more freely in public spaces; some private spaces were reserved for women. Differences can even appear in home etiquette.", "ex": "A host welcomes men on the main level but only women upstairs.", "src": "AMSCO p.141", "quote": "Men have commonly operated more freely than women in public spaces", "f": ["F38"]}, {"sec": "Gender (start here)", "term": "Women-only areas: two views", "plain": "Many women see them as safe places to gather; others view them as discriminatory. Good answers present both.", "ex": "Iran and India restaurants and parks.", "src": "AMSCO p.141", "quote": "Many women view these \"women only\" areas as a safe place to gather and discuss issues, while others view them as discriminatory.", "f": ["F39"]}, {"sec": "Gender (start here)", "term": "Safety in public space", "plain": "Your packet gives two gendered-space data points: Mexico City (19% of women feel very safe in transport) and Japan (unwanted advances occur regularly).", "ex": "Use them as evidence that landscapes can feel different to men and women.", "src": "Packet 3.2", "quote": "Mexico City: 19% of women surveyed reported that they feel very safe in transport.", "f": ["F41"]}, {"sec": "Gender (start here)", "term": "Development and the role of women", "plain": "As countries develop, women gain access to education, the workforce and property rights — so roles and landscapes change. In traditional cultures the primary role is often having children.", "ex": "More women visible in schools, offices and public life.", "src": "Packet 3.2", "quote": "As countries become more economically and socially developed, women have access to more education, the workforce, and property rights.", "f": ["F40"]}, {"sec": "Gender (start here)", "term": "Fundamentalism and women", "plain": "In some fundamentalist traditions women are likely to leave school young, marry by arrangement, and avoid working outside the home. Strength fades with distance from the hearth (distance decay).", "ex": "Strongest in Saudi Arabia/Yemen; weaker in Malaysia/Indonesia.", "src": "AMSCO p.152", "quote": "women are likely to leave school at a young age, to live in an arranged marriage, and to avoid working outside the home", "f": ["F67"]}, {"sec": "Gender (start here)", "term": "Gender in photo analysis", "plain": "When you analyze a photo, look at: physical features; agriculture & industrial practices; religious & linguistic characteristics; sequent occupancy; architecture; land use. Then ask who is present and which spaces are used by whom.", "ex": "Say the photo number, describe the evidence, then explain what it shows about roles or spaces.", "src": "Workbook", "quote": "Agriculture & Industrial practices", "f": ["F42"]}, {"sec": "Gender (start here)", "term": "Relativism applied to customs", "plain": "Don't judge unfamiliar gender-related customs by your own standards. Try to understand them within the culture's values.", "ex": "Suri lip plate: a sign of beauty in that culture.", "src": "Slides 3.1", "quote": "in the Ethiopian Suri tribe, this enormous lip plate is actually a sign of beauty", "f": ["F24"]}, {"sec": "3.1 Culture", "term": "Culture", "plain": "The shared beliefs, values, practices, behaviors and technologies of a society. It is learned, visible and invisible.", "ex": "Speaking English, holiday traditions, how you greet people.", "src": "Slides 3.1", "quote": "Culture: The shared beliefs, values, practices, behaviors, and technologies of a society.", "f": ["F01"]}, {"sec": "3.1 Culture", "term": "Cultural traits & complex", "plain": "A trait is one visible or invisible element. A cultural complex is a series of interrelated traits.", "ex": "The automobile reflects many American values.", "src": "AMSCO p.132", "quote": "A series of interrelated traits make up a cultural complex", "f": ["F03"]}, {"sec": "3.1 Culture", "term": "How culture is learned", "plain": "Imitation, informal instruction, formal instruction.", "ex": "Copying slang; a parent saying “please”; learning history at school.", "src": "AMSCO p.132", "quote": "Culture is learned, in that it develops through experiences, and not merely transmitted through genetics.", "f": ["F02"]}, {"sec": "3.1 Culture", "term": "Culture hearth", "plain": "Where a culture or trait begins, before diffusing.", "ex": "Classical Greece → democracy; NYC → rap.", "src": "AMSCO p.133", "quote": "The area in which a unique culture or a specific trait develops is a culture hearth.", "f": ["F05"]}, {"sec": "3.1 Culture", "term": "Taboo & norm", "plain": "Taboos are heavily discouraged behaviors; norms are agreed standards that guide behavior. Taboos change over time.", "ex": "Pork and insects; Protestant–Catholic marriage once taboo.", "src": "Slides 3.1", "quote": "Cultural Norms: Agreed upon cultural practices or standards that guide the behavior of a culture.", "f": ["F06"]}, {"sec": "3.1 Culture", "term": "Folk / traditional / indigenous", "plain": "Folk: small, homogeneous, rural, slow to change. Traditional: resists rapid change (umbrella term). Indigenous: ethnic group in ancestral lands.", "ex": "Amish (folk & traditional); Navajo, Inuit (indigenous).", "src": "AMSCO p.133", "quote": "The beliefs and practices of small, homogenous groups of people, often living in rural areas that are relatively isolated and slow to change, are known as folk cultures.", "f": ["F08"]}, {"sec": "3.1 Culture", "term": "Popular & global culture", "plain": "Traits that spread quickly over a large area; global culture = adopted worldwide. Often begins in cities and spreads through media.", "ex": "Anime, Bollywood, European soccer.", "src": "AMSCO p.135", "quote": "Elements of popular culture often begin in urban areas and diffuse quickly through globalization processes such as the media and Internet.", "f": ["F12"]}, {"sec": "3.1 Culture", "term": "Space-time compression & globalization", "plain": "Faster transport and communication shrink the time between places. Globalization = integration of the world economy since the 1970s.", "ex": "52 days (1817) → 7 days (1852).", "src": "AMSCO p.134", "quote": "Globalization specifically refers to the increased integration of the world economy since the 1970s.", "f": ["F11"]}, {"sec": "3.1 Culture", "term": "Horizontal vs. vertical diversity", "plain": "Horizontal: each traditional culture is different from others but homogeneous inside. Vertical: a modern urban society is heterogeneous inside.", "ex": "Isolated villages vs. New York City.", "src": "AMSCO p.135", "quote": "popular culture typically exhibits vertical diversity", "f": ["F14"]}, {"sec": "3.1 Culture", "term": "Artifacts, mentifacts, sociofacts", "plain": "Artifacts = tangible objects (material culture). Mentifacts = ideas/beliefs (nonmaterial). Sociofacts = how society organizes itself.", "ex": "Church = artifact; belief in God = mentifact; family = sociofact.", "src": "AMSCO p.137", "quote": "The belief in a god is a mentifact-the religious building or symbols are artifacts.", "f": ["F17"]}, {"sec": "3.1 Culture", "term": "Ethnocentrism vs. cultural relativism", "plain": "Ethnocentrism judges others by your standards and thinks yours is better. Relativism understands others from their own perspective.", "ex": "Fried insects: ask why it is eaten.", "src": "AMSCO p.153", "quote": "Applying cultural relativism, a geographer would attempt to understand why some communities may eat bugs.", "f": ["F19"]}, {"sec": "3.1 Culture", "term": "Local vs. global architecture & land use", "plain": "Local: materials from the local environment. Global: manufactured steel, glass, drywall, cement; placelessness.", "ex": "Thule winter house; city skylines.", "src": "Slides 3.1", "quote": "Materials from the local physical environment. (Snow, mud, stone, bricks, wood, pelts, grass)", "f": ["F22"]}, {"sec": "3.2 Cultural landscapes", "term": "Cultural landscape / built environment", "plain": "The visible human imprint on the land — anything built or altered.", "ex": "Skyscraper or cleared field; signs; roads.", "src": "AMSCO p.139", "quote": "Buildings, roads, signs, and fences are examples of the built environment.", "f": ["F30"]}, {"sec": "3.2 Cultural landscapes", "term": "Placelessness vs. sense of place", "plain": "Placelessness: places look alike. Sense of place: distinctive attributes and feelings.", "ex": "Chicago suburbs vs. California suburbs.", "src": "AMSCO p.138", "quote": "This phenomenon is known as placelessness", "f": ["F31"]}, {"sec": "3.2 Cultural landscapes", "term": "Landscape evidence table", "plain": "Quebec signs = heritage; Pakistan schools = gender attitudes; Shanghai skyscrapers = economic power.", "ex": "Know all three rows.", "src": "AMSCO p.138", "quote": "Gender-segregated schools reflect attitudes toward male and female roles.", "f": ["F32"]}, {"sec": "3.2 Cultural landscapes", "term": "Toponyms", "plain": "Place names that reveal settlement history.", "ex": "I-25: Anglo → Spanish names.", "src": "AMSCO p.139", "quote": "Names change from Anglo words to Spanish names.", "f": ["F33"]}, {"sec": "3.2 Cultural landscapes", "term": "Traditional vs. postmodern architecture", "plain": "Traditional uses local materials and reflects local beliefs. Postmodern (after 1960s) = steel and glass high rises; contemporary = 21st-century extension.", "ex": "Adobe in Santa Fe vs. Shanghai Tower.", "src": "AMSCO p.140", "quote": "Postmodern architecture developed after the 1960s.", "f": ["F34"]}, {"sec": "3.2 Cultural landscapes", "term": "Ethnicity and ethnic enclaves", "plain": "Ethnicity = ancestry, language, customs, history. Enclaves = clusters of the same culture that provide a buffer against discrimination and job networks.", "ex": "Chinatown; Little Mogadishu.", "src": "AMSCO p.140", "quote": "ethnic enclaves-clusters of people of the same culture-that are often surrounded by people of the dominant culture", "f": ["F35"]}, {"sec": "3.2 Cultural landscapes", "term": "Charter group, ethnic islands, urban neighborhoods", "plain": "Charter group: first to establish customs. Ethnic islands: rural concentrations. Urban neighborhoods: migrants settle former charter group space.", "ex": "Amish; Chinatown.", "src": "AMSCO p.145", "quote": "The first group to establish cultural and religious customs in a space is known as the charter group.", "f": ["F48"]}, {"sec": "3.2 Cultural landscapes", "term": "Scale and ethnicity", "plain": "Patterns change by scale: national → state → city. Discrimination limited housing.", "ex": "African Americans: Southeast nationally; neighborhoods in Chicago.", "src": "AMSCO p.146", "quote": "At the national scale, African Americans are concentrated in the southeast United States.", "f": ["F50"]}, {"sec": "   const hintBox=H('div'),fb=H('div');
  let done=false;
  o.forEach((x,i)=>{
   const b=H('button',{class:'opt',type:'button'},H('span',{class:'l'},q.t==='tf'?(i?'F':'T'):LET[i]),H('span'));
   b.lastChild.textContent=x.t;
   b.onclick=()=>{if(done)return;done=true;
    const good=x.ok;card.querySelectorAll('.opt').forEach((bb,j)=>{bb.disabled=true;if(o[j].ok)bb.classList.add('ok')});
    if(!good)b.classList.add('no');
    const s=S.st[q.id]||{r:0,w:0};good?s.r++:s.w++;s.lastOk=good;S.st[q.id]=s;save();
    fb.append(H('div',{class:'exp '+(good?'ok':'no'),html:'<b>'+(good?'Correct!':'Not quite.')+'</b> '+(q.t==='tf'?'The statement is <b>'+(q.ans?'TRUE':'FALSE')+'</b>. ':'')+q.exp}),srcBox(q.src,q.quote))};
   card.append(b)});
  card.append(hintBox,fb,H('div',{class:'row',style:'margin-top:12px'},
   H('button',{class:'btn sec',onclick:()=>{hintBox.innerHTML='';hintBox.append(H('div',{class:'hint',html:'<b>Hint:</b> '+q.hint}))}},'💡 Hint'),
   H('button',{class:'btn sec',onclick:()=>{pi=(pi-1+pl.length)%pl.length;draw()}},'← Prev'),
   H('button',{class:'btn',onclick:()=>{pi=(pi+1)%pl.length;draw()}},'Next →')));
  box.append(H('div',{class:'bar'},H('i',{style:'width:'+Math.round(100*(pi+1)/pl.length)+'%'})),card)}
 rebuild()}

/* ---------- TEST ---------- */
let T=null;
function test(){
 const el=$('#s-test');el.innerHTML='';
 if(T&&!T.done){return drawTest()}
 const n=H('select',{id:'tn'},[['10','10 questions (quick)'],['25','25 questions'],['50','50 questions'],['all','All '+QS.length+' questions']].map(([v,l])=>H('option',{value:v},l)));
 n.value='25';
 const sc=H('select',{id:'ts'},[['all','Everything (3.1–3.3)'],['gender','Gender focus only'],['weak','My weak spots (missed before)'],['3.1','Topic 3.1'],['3.2','Topic 3.2'],['3.3','Topic 3.3']].map(([v,l])=>H('option',{value:v},l)));
 el.append(H('div',{class:'card'},H('h2',{},'Take a test'),H('p',{},'Questions and answer positions are shuffled. No hints and no feedback until you submit. Written questions are in the Written tab.'),
  H('div',{class:'row'},H('label',{class:'f'},'Length',n),H('label',{class:'f'},'Scope',sc),H('button',{class:'btn',onclick:()=>{
   let pool=QS.filter(q=>sc.value==='all'||(sc.value==='gender'&&q.tag==='gender')||(sc.value==='weak'&&S.st[q.id]&&S.st[q.id].w>0)||q.topic===sc.value);
   if(!pool.length){let m=$('#tmsg');if(!m){m=H('p',{id:'tmsg',class:'hint'});$('#s-test .card').append(m)}m.textContent='No questions in that scope yet. Try Practice first.';return}
   pool=pool.map(q=>({q,o:opts(q,true),pick:null})).sort(()=>Math.random()-.5);
   if(n.value!=='all')pool=pool.slice(0,+n.value);
   T={items:pool,i:0,done:false,t0:Date.now()};drawTest()}},'Start test'))),
  S.tests.length?H('div',{class:'card'},H('h3',{},'Past tests'),H('table',{html:'<tr><th>Date</th><th>Score</th><th>Questions</th></tr>'+S.tests.slice(-8).reverse().map(t=>'<tr><td>'+t.date+'</td><td>'+t.pct+'%</td><td>'+t.total+'</td></tr>').join('')})):'')}
function drawTest(){
 const el=$('#s-test');el.innerHTML='';
 const it=T.items[T.i],q=it.q;
 const card=H('div',{class:'card'},H('p',{class:'sub'},'Question '+(T.i+1)+' of '+T.items.length),H('h3',{html:q.q}));
 it.o.forEach((x,i)=>{const b=H('button',{class:'opt'+(it.pick===i?' sel':''),type:'button',onclick:()=>{it.pick=i;drawTest()}},H('span',{class:'l'},q.t==='tf'?(i?'F':'T'):LET[i]),H('span'));b.lastChild.textContent=x.t;card.append(b)});
 const answered=T.items.filter(x=>x.pick!==null).length;
 card.append(H('div',{class:'row',style:'margin-top:12px'},
  H('button',{class:'btn sec',disabled:T.i===0?'':null,onclick:()=>{T.i--;drawTest()}},'← Back'),
  T.i<T.items.length-1?H('button',{class:'btn',onclick:()=>{T.i++;drawTest()}},'Next →'):H('button',{class:'btn',onclick:finish},'Submit test'),
  H('button',{class:'btn sec',onclick:finish},'Submit early ('+answered+'/'+T.items.length+' answered)')));
 el.append(H('div',{class:'bar'},H('i',{style:'width:'+Math.round(100*answered/T.items.length)+'%'})),card);
 if(T.i===0&&!el.dataset.k){}}
function finish(){
 T.done=true;let right=0;const byT={};
 T.items.forEach(it=>{const ok=it.pick!==null&&it.o[it.pick].ok;if(ok)right++;const g=byT[it.q.topic]||(byT[it.q.topic]={r:0,n:0});g.n++;if(ok)g.r++;
  const s=S.st[it.q.id]||{r:0,w:0};ok?s.r++:s.w++;s.lastOk=ok;S.st[it.q.id]=s});
 const pct=Math.round(100*right/T.items.length);
 S.tests.push({date:new Date().toLocaleString(),pct,total:T.items.length});save();
 const el=$('#s-test');el.innerHTML='';
 const msg=pct>=90?'Excellent — you are ready.':pct>=75?'Good. Review the misses below, then retest.':'Keep going: use Learn + Practice on the misses, then retake.';
 el.append(H('div',{class:'card'},H('h2',{},'Score: '+right+' / '+T.items.length+' ('+pct+'%)'),H('p',{},msg),
  H('table',{html:'<tr><th>Topic</th><th>Correct</th></tr>'+Object.entries(byT).map(([k,v])=>'<tr><td>'+k+'</td><td>'+v.r+' / '+v.n+'</td></tr>').join('')}),
  H('div',{class:'row',style:'margin-top:12px'},H('button',{class:'btn',onclick:()=>{T=null;test()}},'New test'),
   H('button',{class:'btn sec',onclick:()=>{const m=T.items.filter(it=>!(it.pick!==null&&it.o[it.pick].ok)).map(it=>({q:it.q,o:opts(it.q,true),pick:null}));if(!m.length)return;T={items:m,i:0,done:false};drawTest()}},'Retry my misses'))));
 const wrong=T.items.filter(it=>!(it.pick!==null&&it.o[it.pick].ok));
 el.append(H('h2',{},wrong.length?'Review your misses ('+wrong.length+')':'No misses!'));
 wrong.forEach(it=>{const q=it.q,c=it.o.findIndex(x=>x.ok);
  el.append(H('div',{class:'card'},H('div',{},tagPill(q)),H('h3',{html:q.q}),
   H('p',{html:'<b>Your answer:</b> '+(it.pick===null?'(blank)':'')}),
   H('div',{class:'exp ok',html:'<b>Correct: </b>'+(q.t==='tf'?(q.ans?'True':'False'):LET[c]+'. ')}),
   H('div',{class:'exp',html:q.exp}),srcBox(q.src,q.quote)));
  const yp=el.lastChild.querySelector('p');if(it.pick!==null)yp.append(document.createTextNode((q.t==='tf'?(it.pick?'False':'True'):LET[it.pick]+'. '+it.o[it.pick].t)));
  const cc=el.lastChild.querySelector('.exp.ok');if(q.t!=='tf')cc.append(document.createTextNode(it.o[c].t))})}

/* ---------- WRITTEN ---------- */
function written(){
 const el=$('#s-written');el.innerHTML='';
 el.append(H('p',{},'Write your answer first (no peeking), then compare with the model answer and tick what you included.'));
 WR.forEach((q,n)=>{
  const ta=H('textarea',{'aria-label':'Your answer'});ta.value=(S.wr[q.id]&&S.wr[q.id].txt)||'';
  ta.oninput=()=>{S.wr[q.id]=S.wr[q.id]||{};S.wr[q.id].txt=ta.value;save()};
  const hb=H('div'),mb=H('div');
  el.append(H('div',{class:'card'},H('p',{class:'sub'},'Written '+(n+1)+' of '+WR.length+' · #'+q.id),H('div',{},tagPill(q)),H('h3',{html:q.q}),
   q.note?H('div',{class:'note'},q.note):'',ta,hb,mb,
   H('div',{class:'row',style:'margin-top:10px'},
    H('button',{class:'btn sec',onclick:()=>{hb.innerHTML='';hb.append(H('div',{class:'hint',html:'<b>Hint:</b> '+q.hint}))}},'💡 Hint'),
    H('button',{class:'btn',onclick:()=>{mb.innerHTML='';mb.append(H('div',{class:'exp',html:'<b>Model answer:</b> '+q.model}),H('div',{class:'card'},H('b',{},'Did you include:'),q.points.map((p,i)=>{const id='w'+q.id+'_'+i;const cb=H('input',{type:'checkbox',id});return H('div',{},cb,' ',H('label',{for:id},p))})),srcBox(q.src,q.quote))}},'Show model answer'))))})}

/* ---------- COVERAGE ---------- */
function coverage(){
 const el=$('#s-coverage');el.innerHTML='';
 const ks=Object.keys(D.F);
 el.append(H('div',{class:'card'},H('h2',{},'Coverage map'),
  H('p',{html:'<b>'+ks.length+'</b> distinct facts extracted from your sources; <b>0</b> have no question. Every question cites an AMSCO page, your notes packet, slides or workbook with an exact quote, which was machine-checked against the source text.'}),
  H('p',{},'Sources read: AMSCO book pp. 131–153 (Topics 3.1–3.3), Student Notes Packet (3.1–3.3), Slides 3.1 and 3.3, Digital Workbook (3.1–3.3), AMSCO Teacher Key (3.1–3.3).')),
  H('div',{class:'card'},H('table',{html:'<tr><th>#</th><th>Fact / concept</th><th>Area</th><th>Question #s</th></tr>'+ks.map(k=>'<tr><td>'+k+'</td><td>'+D.F[k].label+'</td><td>'+D.F[k].grp+'</td><td>'+D.F[k].q.join(', ')+'</td></tr>').join('')})),
  H('div',{class:'note',html:'<b>Not in this guide (and why):</b><ul><li>AP Classroom image questions in the packet — the images and answer keys are not in your files.</li><li>Workbook items on the Kurds, Koreas and Kashmir, and the Hispanic/African American/Asian American maps — your sources contain the question text but no answer content.</li><li>The workbook question “What type of roles can also fit inter-gender categories?” — the sources do not define it; the written question flags this.</li><li>Topics 3.4–3.8 (diffusion, language, religion, effects) — outside the Gender Doll scope; ask me for a separate guide.</li></ul>'}))}
go('home');
</script>
