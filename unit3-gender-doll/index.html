<head>

<style>
:root{--blue:#1a73e8;--blue-d:#174ea6;--blue-l:#e8f0fe;--text:#202124;--text2:#5f6368;--line:#dadce0;--bg:#f8f9fa;--ok:#188038;--ok-bg:#e6f4ea;--bad:#c5221f;--bad-bg:#fce8e6;--warn-bg:#fef7e0;--warn:#b06000}
*{box-sizing:border-box}
body{margin:0;font-family:"Google Sans","Roboto","Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.6;color:var(--text);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
h1{font-size:22px;margin:14px 0 4px;font-weight:500}
.sub{color:var(--text2);font-size:15px;margin:0 0 8px}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
nav button{border:0;background:none;font:inherit;font-size:15px;padding:10px 14px;color:var(--text2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;min-height:44px}
nav button[aria-selected=true]{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}
nav button:hover{background:var(--blue-l)}
main{padding:20px 0 60px}
section.tab{display:none}section.tab.on{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:0 0 16px}
h2{font-size:21px;font-weight:500;margin:0 0 10px}h3{font-size:18px;font-weight:500;margin:0 0 6px}
button,select,textarea{font:inherit}
.btn{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:10px 20px;cursor:pointer;min-height:44px;font-weight:500}
.btn:hover{background:var(--blue-d)}
.btn.sec{background:#fff;color:var(--blue);border:1px solid var(--line)}
.btn.sec:hover{background:var(--blue-l)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid #fbbc04;outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pill{display:inline-block;background:var(--blue-l);color:var(--blue-d);border-radius:12px;padding:1px 10px;font-size:13px;font-weight:500}
.pill.g{background:#fce8e6;color:#a50e0e}
label.f{display:flex;flex-direction:column;font-size:14px;color:var(--text2);gap:2px}
select{padding:8px;border:1px solid var(--line);border-radius:6px;background:#fff;min-height:40px}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:17px;color:var(--text)}
.opt:hover:not([disabled]){background:var(--blue-l);border-color:var(--blue)}
.opt .l{font-weight:700;color:var(--blue-d);min-width:1.4em}
.opt.sel{border-color:var(--blue);background:var(--blue-l)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.no{background:var(--bad-bg);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.hint{background:var(--warn-bg);border-left:4px solid #f9ab00;padding:10px 14px;border-radius:4px;margin:10px 0}
.exp{background:var(--blue-l);border-left:4px solid var(--blue);padding:12px 16px;border-radius:4px;margin:12px 0}
.exp.ok{background:var(--ok-bg);border-left-color:var(--ok)}.exp.no{background:var(--bad-bg);border-left-color:var(--bad)}
.src{font-size:14px;color:var(--text2);border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}
.src q{display:block;font-style:italic;color:var(--text)}
details.lc{border:1px solid var(--line);border-radius:8px;margin:8px 0;background:#fff}
details.lc summary{padding:12px 16px;cursor:pointer;font-weight:500;min-height:44px}
details.lc .in{padding:0 16px 14px}
.bar{height:10px;background:#e8eaed;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.fc{min-height:240px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;cursor:pointer;padding:24px}
.fc .back{font-size:17px;text-align:left}
textarea{width:100%;min-height:110px;padding:10px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}th{background:var(--bg)}
.stat{font-size:30px;font-weight:500;color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.note{background:var(--warn-bg);border:1px solid #fde293;border-radius:8px;padding:12px 16px;margin:0 0 16px}
@media (max-width:600px){body{font-size:16px}.opt{font-size:16px}}
</style>

const D={"Q": [{"t": "mc", "topic": "3.1", "tag": "culture", "f": ["F01"], "q": "Which statement best defines <b>culture</b>?", "hint": "Culture is about what a whole group shares and passes on — not nature, genes, or government.", "exp": "Culture is the full package a society shares: what people believe, value, do, and make. <b>Example:</b> a family eating dinner together, speaking English, and celebrating holidays is using shared beliefs, practices and language — all culture. Art and food are only <i>part</i> of it, so “only art, music, food” is too narrow.", "src": "Slides 3.1", "quote": "Culture: The shared beliefs, values, practices, behaviors, and technologies of a society.", "opts": ["The laws and borders a government enforces", "Traits a person inherits genetically from their parents", "Only the art, music, and food of a society", "The shared beliefs, values, practices, behaviors, and technologies of a society", "The natural physical features of the place a group lives"], "key": 3, "id": 1}, {"t": "mc", "topic": "3.1", "tag": "culture", "f": ["F02"], "q": "Why do geographers say culture is <b>not</b> something you inherit genetically?", "hint": "Think: could a baby raised in another country learn a different language?", "exp": "Culture develops through experience. <b>Example:</b> a child born to English speakers but raised in Spain learns Spanish — nothing in the genes decided the language.", "src": "AMSCO p.132", "quote": "Culture is learned, in that it develops through experiences, and not merely transmitted through genetics.", "opts": ["It is learned through experience and passed between people", "It is fixed by the climate of the region", "It appears automatically at birth in every child", "It only changes when governments change laws", "It is determined by physical appearance"], "key": 0, "id": 2}, {"t": "tf", "topic": "3.1", "tag": "culture", "f": ["F02"], "q": "TRUE or FALSE: Culture is only a <i>visible</i> force that you can see in people's actions and possessions.", "ans": false, "hint": "The book calls culture both visible AND invisible.", "exp": "False. Culture is visible (actions, possessions, buildings) <i>and</i> invisible (shared belief systems, customs, traditions). <b>Example:</b> you can see a church (visible) but not the belief that makes it sacred (invisible).", "src": "AMSCO p.132", "quote": "Culture is also an invisible force guiding people through shared belief systems, customs, and traditions.", "id": 3}, {"t": "mc", "topic": "3.1", "tag": "culture", "f": ["F03"], "q": "A parent reminds a child to say “please.” Which way of learning culture is this?", "hint": "Not a classroom, not copying — someone is correcting casually.", "exp": "The three ways are imitation (copying), informal instruction (everyday reminders), and formal instruction (school). <b>Example:</b> learning history in class = formal; copying slang from a TV show = imitation.", "src": "AMSCO p.132", "quote": "informal instruction, as when a parent reminds a child to say \"please\"", "opts": ["Informal instruction", "Diffusion", "Formal instruction", "Genetic transmission", "Imitation"], "key": 0, "id": 4}, {"t": "mc", "topic": "3.1", "tag": "culture", "f": ["F03"], "q": "A <b>cultural complex</b> is best described as…", "hint": "Complex = many traits linked together.", "exp": "Single traits (visible or invisible) combine into a cultural complex. <b>Example:</b> the automobile in the US links values like independence, freedom of movement and status — many traits in one complex.", "src": "AMSCO p.132", "quote": "A series of interrelated traits make up a cultural complex", "opts": ["A series of interrelated cultural traits", "A single tool used by one person", "A behavior heavily discouraged by a culture", "A place where a trait first began", "The spread of a trait to new places"], "key": 0, "id": 5}, {"t": "mc", "topic": "3.1", "tag": "culture", "f": ["F05"], "q": "New York City in the 1970s is cited as the <b>culture hearth</b> for rap music. What is a culture hearth?", "hint": "Hearth = where it started.", "exp": "A hearth is the origin point. From there traits diffuse outward. <b>Example:</b> Classical Greece is the hearth of democracy; rap began in NYC.", "src": "AMSCO p.133", "quote": "The area in which a unique culture or a specific trait develops is a culture hearth.", "opts": ["A government's center of power", "A neighborhood of one ethnic group in a city", "Any place where a trait is popular today", "The route a trait takes when it spreads", "The area where a unique culture or specific trait develops"], "key": 4, "id": 6}, {"t": "mc", "topic": "3.1", "tag": "culture", "f": ["F06"], "q": "A <b>taboo</b> is…", "hint": "Taboo = “don't do that.” Norms = “this is the standard.”", "exp": "Taboos are strongly discouraged behaviors; norms are agreed standards (the last option mixes these up). <b>Example:</b> many cultures have taboos against eating pork or insects.", "src": "AMSCO p.133", "quote": "Geographers also study taboos, behaviors heavily discouraged by a culture.", "opts": ["A tool made by a culture", "An agreed-upon cultural standard that guides behavior", "A behavior heavily discouraged by a culture", "A behavior required of all members of a culture", "A belief in more than one god"], "key": 2, "id": 7}, {"t": "tf", "topic": "3.1", "tag": "culture", "f": ["F06"], "q": "TRUE or FALSE: What a culture considers taboo stays the same forever.", "ans": false, "hint": "Think about Protestant–Catholic marriages in the US.", "exp": "False. Taboos change over time. <b>Example:</b> marriages between Protestants and Catholics were once taboo in the US but are not widely opposed now.", "src": "AMSCO p.133", "quote": "What is considered taboo changes over time.", "id": 8}, {"t": "mc", "topic": "3.1", "tag": "culture", "f": ["F08"], "q": "Which description best fits a <b>folk culture</b>?", "hint": "Small + rural + slow to change.", "exp": "Folk culture = small, similar (homogeneous) groups, often in isolated rural areas. <b>Example:</b> the Amish of Pennsylvania. The first distractor describes <i>popular</i> culture.", "src": "AMSCO p.133", "quote": "The beliefs and practices of small, homogenous groups of people, often living in rural areas that are relatively isolated and slow to change, are known as folk cultures.", "opts": ["Any group that speaks English", "Small, homogeneous groups, often rural, relatively isolated and slow to change", "A culture that has no tools or buildings", "Large, diverse groups in connected urban areas that change quickly", "A group displaced from every homeland"], "key": 1, "id": 9}, {"t": "mc", "topic": "3.1", "tag": "culture", "f": ["F09"], "q": "Which situation is an example of an <b>indigenous culture</b>?", "hint": "Look for “ancestral lands.”", "exp": "Indigenous = an ethnic group in its ancestral lands with unique traits. <b>Example:</b> the Navajo in the US, the Inuit of Canada.", "src": "AMSCO p.134", "quote": "they are considered an indigenous culture", "opts": ["A fast-food chain opening in 40 countries", "A tourist visiting a museum", "Teenagers in many countries watching the same streaming show", "Immigrants forming a Chinatown in a new city", "An ethnic group living in its ancestral lands with unique traits, such as its own language"], "key": 4, "id": 10}, {"t": "mc", "topic": "3.1", "tag": "culture", "f": ["F07"], "q": "Which group does the textbook say is often referenced as BOTH folk and traditional culture?", "hint": "A rural Pennsylvania religious community.", "exp": "The lines between folk, traditional and indigenous are blurring; the Amish are the book's example of overlap.", "src": "AMSCO p.134", "quote": "the Amish of Pennsylvania are often referenced as both folk and traditional culture", "opts": ["People in a large global city", "Players in the NBA", "The Amish of Pennsylvania", "Hollywood film studios", "Fast-food corporations"], "key": 2, "id": 11}, {"t": "mc", "topic": "3.1", "tag": "culture", "f": ["F10"], "q": "In 1817 a freight shipment from Cincinnati to New York took 52 days; by 1852 it took 7 days. Which concept does this show?", "hint": "Distance feels shorter as travel speeds up.", "exp": "Faster transport/communication shortens the time between places (space-time compression), which speeds culture change. <b>Example:</b> today digital information moves in seconds.", "src": "AMSCO p.134", "quote": "In 1817, a freight shipment from Cincinnati needed 52 days", "opts": ["Ethnocentrism", "Space-time compression", "Sequent occupancy", "Placelessness", "Cultural appropriation"], "key": 1, "id": 12}, {"t": "mc", "topic": "3.1", "tag": "culture", "f": ["F11"], "q": "Which statement defines <b>globalization</b> as used in AMSCO?", "hint": "Think “world economy” and “since the 1970s.”", "exp": "Globalization = intensified interaction among peoples, governments and companies worldwide. <b>Example:</b> the NBA included players from 38 countries or territories in 2019.", "src": "AMSCO p.134", "quote": "Globalization specifically refers to the increased integration of the world economy since the 1970s.", "opts": ["The spread of one language inside one country", "The isolation of folk cultures from outside influence", "The increased integration of the world economy since the 1970s", "The study of landscapes of one region", "The building of walls between cultures"], "key": 2, "id": 13}, {"t": "mc", "topic": "3.1", "tag": "culture", "f": ["F12"], "q": "Elements of <b>popular culture</b> typically begin and spread in what way?", "hint": "Popular = fast and urban.", "exp": "Popular culture spreads fast via globalization processes like media. <b>Example:</b> Bollywood movies, anime, European soccer followed worldwide.", "src": "AMSCO p.135", "quote": "Elements of popular culture often begin in urban areas and diffuse quickly through globalization processes such as the media and Internet.", "opts": ["They often begin in urban areas and diffuse quickly through media and the Internet", "They begin in remote villages and spread slowly by migration only", "They are limited to one ethnic group", "They spread only through formal schooling", "They are inherited and never change"], "key": 0, "id": 14}, {"t": "mc", "topic": "3.1", "tag": "culture", "f": ["F12"], "q": "Popular cultural traits (clothing, music, fast food) tend to make landscapes across many places…", "hint": "Same malls, same shops.", "exp": "Popular culture promotes uniformity in beliefs, values and the landscape. <b>Example:</b> similar malls, shops, fast food and clothing in cities everywhere.", "src": "AMSCO p.135", "quote": "popular cultural traits often promote uniformity in beliefs, values, and the cultural landscape across many places", "opts": ["More isolated", "More uniform", "More sacred", "More horizontally diverse", "Less connected"], "key": 1, "id": 15}, {"t": "mc", "topic": "3.1", "tag": "culture", "f": ["F13"], "q": "The Yanamamo (Brazilian rain forest) example shows what clash?", "hint": "Who leaves the community, and what do they adopt?", "exp": "As young people leave their communities they are more likely to accept popular culture, threatening the folk culture. <b>Example:</b> a teen who moves to a city and stops speaking the tribal language.", "src": "AMSCO p.135", "quote": "young people leave their communities, they are more likely to accept popular culture at the expense of their indigenous cultural heritage", "opts": ["The rain forest prevents any outside contact forever", "Indigenous groups invent popular culture", "Older generations quickly adopt every new popular trait", "Young people exposed to popular culture may accept it at the expense of indigenous heritage", "Popular culture disappears when it reaches forests"], "key": 3, "id": 16}, {"t": "mc", "topic": "3.1", "tag": "culture", "f": ["F14"], "q": "<b>Horizontal diversity</b> means…", "hint": "Differences are BETWEEN groups across space; inside each group = similar.", "exp": "Horizontal = differences across space between homogeneous groups. Vertical = differences within one heterogeneous society. <b>Example:</b> two isolated villages with different languages = horizontal.", "src": "AMSCO p.135", "quote": "Traditional culture typically exhibits horizontal diversity, meaning each traditional culture has its own customs and language", "opts": ["Only religion differs between groups", "Culture changes quickly across generations", "A modern city has many ethnic groups mixed together", "All cultures are identical worldwide", "Each traditional culture has its own customs and language, but people inside each group are similar"], "key": 4, "id": 17}, {"t": "mc", "topic": "3.1", "tag": "culture", "f": ["F14"], "q": "<b>Vertical diversity</b> is typical of…", "hint": "Diversity stacked inside one society.", "exp": "Vertical diversity = a heterogeneous modern urban society with multiethnic neighborhoods. <b>Example:</b> New York City.", "src": "AMSCO p.135", "quote": "popular culture typically exhibits vertical diversity", "opts": ["Only the Amish", "Groups with a single shared language and religion", "Isolated folk cultures", "Cultures with no cities", "Popular culture in modern urban societies that are heterogeneous inside"], "key": 4, "id": 18}, {"t": "mc", "topic": "3.1", "tag": "gender", "f": ["F15", "F23"], "q": "According to the AMSCO comparison table, which trait belongs to <b>traditional</b> culture?", "hint": "Traditional = well-defined; popular = weakly defined.", "exp": "Traditional cultures: emphasis on community and conformity, families living close, well-defined gender roles. Popular/global culture: weakly defined gender roles, dispersed families, individualism.", "src": "AMSCO p.136", "quote": "Well-defined gender roles", "opts": ["Weakly defined gender roles", "Well-defined gender roles", "Dispersed families", "Social media and mass media diffusion", "Emphasis on individualism and making choices"], "key": 1, "id": 19}, {"t": "tf", "topic": "3.1", "tag": "gender", "f": ["F15", "F23"], "q": "TRUE or FALSE: In the AMSCO comparison, popular/global culture is described as having “weakly defined gender roles.”", "ans": true, "hint": "Check the Social Structure row.", "exp": "True — in the Social Structure row, popular culture lists “Weakly defined gender roles” while traditional culture lists “Well-defined gender roles.”", "src": "AMSCO p.136", "quote": "Weakly defined gender roles", "id": 20}, {"t": "mc", "topic": "3.1", "tag": "culture", "f": ["F16"], "q": "The ability to read English and a family's clothing and housing types are examples of…", "hint": "Tangible things sensed by touch or sight.", "exp": "Artifacts make up material culture: tangible things (art, clothing, food, music, sports, housing). <b>Example:</b> a jersey is an artifact; the loyalty you feel to the team is a mentifact.", "src": "AMSCO p.136", "quote": "artifacts that comprise the material culture, which consists of tangible things", "opts": ["Taboos", "Sociofacts", "Cultural hearths", "Mentifacts", "Artifacts (material culture)"], "key": 4, "id": 21}, {"t": "mc", "topic": "3.1", "tag": "culture", "f": ["F17"], "q": "The belief in a god is a ______, while the religious building is a(n) ______.", "hint": "Idea = mentifact. Object = artifact.", "exp": "Mentifacts are intangible ideas/beliefs/values; artifacts are physical objects. The book states this exact example.", "src": "AMSCO p.137", "quote": "The belief in a god is a mentifact-the religious building or symbols are artifacts.", "opts": ["artifact; mentifact", "sociofact; mentifact", "mentifact; artifact", "mentifact; sociofact", "taboo; sociofact"], "key": 2, "id": 22}, {"t": "mc", "topic": "3.1", "tag": "culture", "f": ["F18"], "q": "Western cultures often view the nuclear family as the basic unit, while many Western African cultures see the extended family as the norm. Families are an example of…", "hint": "Sociofacts = how society organizes itself.", "exp": "Sociofacts are the ways people organize society and relate to one another: families, governments, sports teams, religious organizations, education systems.", "src": "AMSCO p.137", "quote": "Sociofacts are embodied through families, governments, sports teams", "opts": ["Sociofacts", "Cultural hearths", "Artifacts", "Taboos", "Mentifacts only"], "key": 0, "id": 23}, {"t": "mc", "topic": "3.1", "tag": "gender", "f": ["F23"], "q": "Your teacher lists <b>gender roles</b> under which category of culture?", "hint": "Roles describe how people organize themselves — like family and government.", "exp": "Slides list Family, School/Education, Government, Religion, Land Use and Gender Roles under sociofacts: the ways a society behaves and organizes institutions. <b>Example:</b> who does farm work vs. who leads religion is a sociofact.", "src": "Slides 3.1", "quote": "Religion - Land Use - Gender Roles", "opts": ["Artifacts", "Mentifacts", "Sociofacts", "Taboos", "Material culture"], "key": 2, "id": 24}, {"t": "mc", "topic": "3.1", "tag": "culture", "f": ["F19"], "q": "<b>Ethnocentrism</b> is…", "hint": "The “we vs. them” attitude.", "exp": "Ethnocentrism leads to misinterpretations and can fuel centrifugal forces. The second option is the opposite, <b>cultural relativism</b>.", "src": "Slides 3.1", "quote": "Ethnocentrism: Judging other cultures in terms of one's own standards", "opts": ["Trying to understand a culture from its own perspective", "Moving to a new country", "Judging other cultures by the standards of your own and believing yours is better", "Borrowing traits from another culture", "Spreading a religion by conquest"], "key": 2, "id": 25}, {"t": "mc", "topic": "3.1", "tag": "culture", "f": ["F19"], "q": "<b>Cultural relativism</b> is…", "hint": "Walk in their shoes.", "exp": "Relativism counters ethnocentrism. <b>Example:</b> instead of being disgusted by fried insects, ask why a community eats them.", "src": "AMSCO p.152", "quote": "A counter to ethnocentric views has been cultural relativism, which is the concept that a person's or group's beliefs, values, norms, and practices should", "opts": ["Ignoring other cultures", "Understanding a group's beliefs, values and practices from that group's own cultural perspective", "Banning outside influence", "Eliminating all cultural differences", "Believing your culture is superior"], "key": 1, "id": 26}, {"t": "mc", "topic": "3.1", "tag": "culture", "f": ["F19"], "q": "A geographer applying <b>cultural relativism</b> to people who eat fried insects would most likely…", "hint": "Ask WHY, don't judge.", "exp": "The book's explanation: other protein sources were not available, so the food became ingrained in the culture. <b>Gender link:</b> the same approach applies to gender customs — understand context before judging.", "src": "AMSCO p.153", "quote": "Applying cultural relativism, a geographer would attempt to understand why some communities may eat bugs.", "opts": ["Ignore the practice", "Force the community to stop", "Say their culture is less developed", "Try to understand why insects became an available protein source in that community", "Declare the practice disgusting and wrong"], "key": 3, "id": 27}, {"t": "mc", "topic": "3.1", "tag": "gender", "f": ["F24"], "q": "A student calls the Suri lip plate (a sign of beauty for Suri girls) “weird.” A cultural-relativist response would be…", "hint": "Judge from inside the culture, not from your own standards.", "exp": "The slide says that “it may look odd to us” but is a sign of beauty in the Suri tribe. Cultural relativism seeks to understand practices on their own cultural terms — the opposite of ethnocentrism.", "src": "Slides 3.1", "quote": "in the Ethiopian Suri tribe, this enormous lip plate is actually a sign of beauty", "opts": ["Beauty standards are universal", "It proves the Suri culture is inferior", "It has no cultural meaning", "It should be banned worldwide", "It is a trait that must be understood within the Suri culture's own values of beauty"], "key": 4, "id": 28}, {"t": "mc", "topic": "3.1", "tag": "culture", "f": ["F20"], "q": "<b>Cultural norms</b> are…", "hint": "Norms = the expected standards.", "exp": "Norms guide behavior; taboos are the heavily discouraged ones. <b>Example:</b> shaking hands when meeting someone in the US.", "src": "Slides 3.1", "quote": "Cultural Norms: Agreed upon cultural practices or standards that guide the behavior of a culture.", "opts": ["The origin point of a trait", "Laws only written by governments", "Physical objects made by a culture", "Agreed-upon cultural practices or standards that guide the behavior of a culture", "Behaviors heavily discouraged by a culture"], "key": 3, "id": 29}, {"t": "mc", "topic": "3.1", "tag": "culture", "f": ["F22"], "q": "Compared with global/popular culture, <b>local/indigenous culture</b> architecture typically uses…", "hint": "Local = from nearby nature.", "exp": "Local culture: snow, mud, stone, bricks, wood, pelts, grass. Global culture: manufactured glass, steel, drywall, cement. <b>Example:</b> an Arctic Thule house of flagstones, whale bone and sod.", "src": "Slides 3.1", "quote": "Materials from the local physical environment. (Snow, mud, stone, bricks, wood, pelts, grass)", "opts": ["Materials from the local physical environment such as mud, stone, wood or grass", "Identical designs everywhere", "Mass-produced drywall and cement only", "Materials shipped only by air", "Steel and glass made in distant factories"], "key": 0, "id": 30}, {"t": "mc", "topic": "3.1", "tag": "culture", "f": ["F21"], "q": "<b>Placelessness</b> is…", "hint": "Everywhere starts to look the same.", "exp": "Placelessness is a global-culture trait. <b>Example:</b> suburbs in Illinois and California that look nearly identical. Opposite: <b>sense of place</b>.", "src": "Slides 3.1", "quote": "Placelessness:  loss of uniqueness of place in the cultural landscape", "opts": ["The spread of a trait through migration", "Land set aside for protection", "Loss of uniqueness of place so one place looks like the next", "A place where a religion began", "A strong emotional tie to a unique location"], "key": 2, "id": 31}, {"t": "mc", "topic": "3.1", "tag": "culture", "f": ["F21"], "q": "<b>Sense of place</b> is best described as…", "hint": "Distinctiveness.", "exp": "Sense of place = what makes a location distinctive. <b>Example:</b> the Great Wall of China (slides).", "src": "Slides 3.3", "quote": "Sense of Place: Unique attributes of a specific location", "opts": ["A trait that spreads by relocation", "The unique attributes of a specific location — cultural influences and feelings evoked by people in a place", "The legal border of a state", "A taboo against leaving home", "A place that looks identical to every other place"], "key": 1, "id": 32}, {"t": "mc", "topic": "3.1", "tag": "gender", "f": ["F24"], "q": "On Maasai culture, the slide says Maasai women meet to make beaded jewelry. A beaded necklace is best classified as…", "hint": "Can you hold it?", "exp": "A necklace is a tangible object → artifact. The social routine of women gathering to make it is a sociofact; the beliefs about what it means are mentifacts.", "src": "Slides 3.1", "quote": "Maasai women set aside time every day to meet and work on beaded jewelry", "opts": ["An artifact (material culture)", "A mentifact", "A cultural hearth", "A sociofact", "A taboo"], "key": 0, "id": 33}, {"t": "mc", "topic": "3.2", "tag": "landscape", "f": ["F30"], "q": "The <b>cultural landscape</b> (built environment) is…", "hint": "Anything humans changed — from a skyscraper to a cleared field.", "exp": "It includes everything from skyscrapers to a cleared field. <b>Example:</b> condos on Florida's coast, ski lifts in Colorado, wheat fields in Oklahoma.", "src": "AMSCO p.138", "quote": "the visible reflection of a culture", "opts": ["The visible reflection of a culture — any human alteration of the landscape", "Only untouched natural scenery", "Only buildings taller than 10 stories", "The legal borders of a country", "A map of language families"], "key": 0, "id": 34}, {"t": "mc", "topic": "3.2", "tag": "landscape", "f": ["F30"], "q": "Which is an example of the <b>built environment</b>?", "hint": "Built = made by humans.", "exp": "Natural environment = plants, air, water, animals. Built environment = physical artifacts humans created.", "src": "AMSCO p.139", "quote": "Buildings, roads, signs, and fences are examples of the built environment.", "opts": ["A mountain range", "The ocean current", "Plants, air, water, and animals", "Natural soil minerals", "Buildings, roads, signs, and fences"], "key": 4, "id": 35}, {"t": "mc", "topic": "3.2", "tag": "landscape", "f": ["F31"], "q": "Suburbs in Illinois and California in <i>Ferris Bueller's Day Off</i> looked alike because of comparable incomes, similar architecture and common culture. This is…", "hint": "Homogeneous modern landscapes.", "exp": "Placelessness = many modern landscapes exhibit a great deal of homogeneity.", "src": "AMSCO p.138", "quote": "This phenomenon is known as placelessness", "opts": ["Sequent occupancy", "A culture hearth", "Placelessness", "Neolocalism", "An ethnic island"], "key": 2, "id": 36}, {"t": "mc", "topic": "3.2", "tag": "landscape", "f": ["F32"], "q": "Bilingual French–English signs in Quebec show what about the cultural landscape?", "hint": "Language shown on signs = identity.", "exp": "Signage is an element of the cultural landscape. <b>Example:</b> signs in Irish in Ireland, or French in Quebec, show linguistic identity.", "src": "AMSCO p.138", "quote": "Bilingual signs in French and English reflect the desire of French Canadians to retain their heritage.", "opts": ["A new postmodern architecture", "The dominance of English only", "The location of a culture hearth", "Forced migration", "The desire of French Canadians to retain their heritage"], "key": 4, "id": 37}, {"t": "mc", "topic": "3.2", "tag": "gender", "f": ["F32"], "q": "In the AMSCO table of cultural landscape examples, <b>gender-segregated schools in Pakistan</b> reflect…", "hint": "The row is about schools and gender.", "exp": "The landscape (separate schools) shows cultural attitudes. This is a <b>gendered space</b>. Compare: Shanghai skyscrapers reflect economic power.", "src": "AMSCO p.138", "quote": "Gender-segregated schools reflect attitudes toward male and female roles.", "opts": ["The desire to retain a heritage language", "Postmodern architecture", "A desire to preserve wilderness", "Economic power and prestige", "Attitudes toward male and female roles"], "key": 4, "id": 38}, {"t": "mc", "topic": "3.2", "tag": "landscape", "f": ["F32"], "q": "Massive skyscrapers in Shanghai reflect…", "hint": "Tall buildings = wealth.", "exp": "Skyscrapers signal economic power; also tied to postmodern/contemporary architecture and globalized popular culture.", "src": "AMSCO p.138", "quote": "Massive skyscrapers reflect economic power", "opts": ["Subsistence farming", "Attitudes toward male and female roles", "The desire to protect a wilderness", "A bilingual population", "Economic power and a desire for a prestigious location"], "key": 4, "id": 39}, {"t": "mc", "topic": "3.2", "tag": "landscape", "f": ["F33"], "q": "Travelers on Interstate 25 from Wyoming to New Mexico see place names change from Anglo words to Spanish names. These place names are called…", "hint": "Toponym = place name.", "exp": "Toponyms reveal who settled or influenced a place. Teacher key: Spanish toponyms (Las Vegas, Santa Fe), Native American (Cheyenne), U.S. English (Denver, Fort Collins).", "src": "AMSCO p.139", "quote": "Names change from Anglo words to Spanish names.", "opts": ["Sociofacts", "Toponyms", "Isoglosses", "Enclaves", "Taboos"], "key": 1, "id": 40}, {"t": "mc", "topic": "3.2", "tag": "landscape", "f": ["F34"], "q": "<b>Traditional architecture</b> typically…", "hint": "Think adobe in the Southwest or steep roofs in New England.", "exp": "Examples: Spanish adobe homes; New England colonial wood homes with steep-pitched roofs. Traditional architecture is built with utility to people and community as a central focus.", "src": "AMSCO p.139", "quote": "Traditional architecture style reflects a local culture's history, beliefs, values", "opts": ["Is always identical worldwide", "Uses mostly steel and glass skyscraper forms", "Reflects local history and beliefs and uses locally available materials", "Has no connection to environment", "Is built only after the 1960s"], "key": 2, "id": 41}, {"t": "mc", "topic": "3.2", "tag": "landscape", "f": ["F34"], "q": "<b>Postmodern architecture</b> developed after the 1960s and is known for…", "hint": "Skyscrapers.", "exp": "Postmodern = a movement away from boxy concrete/brick toward high rises of steel and glass. Contemporary architecture (21st century) extends it with rotating, curving buildings. Example: Houston's Bank of America Center, Shanghai Tower.", "src": "AMSCO p.140", "quote": "Postmodern architecture developed after the 1960s.", "opts": ["Adobe mud homes", "Boxy concrete structures only", "High-rise structures of steel and glass siding", "Stupas", "Wooden homes with steep roofs"], "key": 2, "id": 42}, {"t": "mc", "topic": "3.2", "tag": "ethnicity", "f": ["F35"], "q": "<b>Ethnic enclaves</b> are…", "hint": "Clusters in a neighborhood or subregion.", "exp": "Inside enclaves you often find stores, religious institutions, signs in a traditional language, and architecture from the place of origin. <b>Example:</b> Chinatown in San Francisco; Little Mogadishu (Somali) in Minneapolis.", "src": "AMSCO p.140", "quote": "ethnic enclaves-clusters of people of the same culture-that are often surrounded by people of the dominant culture", "opts": ["Rural ethnic concentrations only", "Land set aside for wilderness", "The first group to settle an area", "Regions defined by mountain ranges", "Clusters of people of the same culture, often surrounded by the dominant culture"], "key": 4, "id": 43}, {"t": "mc", "topic": "3.2", "tag": "ethnicity", "f": ["F35"], "q": "Which is a reason ethnic enclaves form?", "hint": "Protection and support.", "exp": "Enclaves reflect both a group's desire to remain apart and a dominant culture's desire to segregate a minority. Packet: a response to racism and discrimination; a way to maintain cultural identity.", "src": "AMSCO p.141", "quote": "a buffer against discrimination by the dominant culture or a network of people", "opts": ["To provide a buffer against discrimination and a network for employment and cultural integration", "To avoid learning any culture", "Because the government bans other housing", "Because of physical geography only", "Because all immigrants prefer rural land"], "key": 0, "id": 44}, {"t": "mc", "topic": "3.2", "tag": "ethnicity", "f": ["F54"], "q": "According to your notes, <b>ethnicity</b> differs from <b>race</b> because ethnicity is based on…", "hint": "Race = physical. Ethnicity = culture + ancestry.", "exp": "Ethnicity is a sense of belonging bound by common ancestry and culture. AMSCO adds ancestry, language, customs and history.", "src": "Packet 3.2", "quote": "This is different from race, which is based on physical characteristics", "opts": ["Citizenship", "Physical characteristics only", "Religion alone", "Common ancestry and culture rather than physical characteristics", "Political boundaries"], "key": 3, "id": 45}, {"t": "mc", "topic": "3.2", "tag": "ethnicity", "f": ["F54"], "q": "Which are ways to see ethnicity on the cultural landscape (per your notes)?", "hint": "Think of what you would see walking through Chinatown.", "exp": "Ethnic neighborhoods show their culture through signs, restaurants, shops and religious buildings.", "src": "Packet 3.2", "quote": "Language, religious imagery/buildings, restaurants, specialty stores, markets", "opts": ["Only population density", "Only election maps", "Only skyscrapers", "Only weather patterns", "Language, religious imagery/buildings, restaurants, specialty stores, markets"], "key": 4, "id": 46}, {"t": "mc", "topic": "3.2", "tag": "gender", "f": ["F36"], "q": "In <b>folk cultures</b>, the textbook says gender roles are often…", "hint": "Women: domestic. Men: money + leadership.", "exp": "Women usually handle farming, educating children, and caring for family; men often earn money outside the home and serve as leaders in religion and politics. <b>Example:</b> a rural village where mother farms/raises kids and father leads at the temple.", "src": "AMSCO p.141", "quote": "In folk cultures, people often have clearly defined gender-specific roles.", "opts": ["Clearly defined, with women handling domestic responsibilities and men working outside the home", "Determined by popular media", "The same for all cultures in the world", "Weakly defined and interchangeable", "Illegal"], "key": 0, "id": 47}, {"t": "mc", "topic": "3.2", "tag": "gender", "f": ["F37"], "q": "Why do women in <b>popular culture</b> tend to gain more economic power?", "hint": "Education → work → economic power → leadership.", "exp": "It is a chain: access to education → more opportunities outside the home → economic power → opportunities to lead. Compare folk cultures where roles are tightly defined.", "src": "AMSCO p.141", "quote": "Women in popular culture tend to have more access to education which leads to more opportunities to work outside of the home.", "opts": ["Because folk traditions require it", "They tend to have more access to education, leading to work outside the home and leadership roles", "Because popular culture bans male employment", "Because they are given land by the government", "Because they live in more isolated areas"], "key": 1, "id": 48}, {"t": "mc", "topic": "3.2", "tag": "gender", "f": ["F38"], "q": "A <b>gendered space</b> is…", "hint": "The landscape + gender roles.", "exp": "Gendered spaces show how cultural values distribute power. <b>Example:</b> a “women only” subway car, or separate schools for boys and girls.", "src": "Packet 3.2", "quote": "Gendered Spaces: Places in the cultural landscape utilized to reinforce or accommodate gender roles for men and women.", "opts": ["A region of shared language", "A sacred site of a religion", "A neighborhood of one ethnic group", "A place in the cultural landscape used to reinforce or accommodate gender roles for men and women", "Any place named after a person"], "key": 3, "id": 49}, {"t": "mc", "topic": "3.2", "tag": "gender", "f": ["F38"], "q": "Which statement matches the textbook's view of gendered spaces?", "hint": "Public = men more free; private = reserved for women.", "exp": "Throughout history and in many cultures, some behaviors were acceptable for only one gender and often only in certain spaces.", "src": "AMSCO p.141", "quote": "Men have commonly operated more freely than women in public spaces", "opts": ["Gender never affects land use", "Gendered spaces appear in only one country", "Women have always operated more freely in public spaces", "Men have commonly operated more freely than women in public spaces, while certain private spaces were reserved for women", "Men have been confined to private spaces"], "key": 3, "id": 50}, {"t": "mc", "topic": "3.2", "tag": "gender", "f": ["F38"], "q": "The textbook says a host might welcome men in public areas on the main level but feel comfortable only with women visiting the upper-level private rooms. This illustrates…", "hint": "Different rooms, different genders.", "exp": "Gendered spaces can be small-scale (rooms in a house) as well as large-scale (parks, schools, transit).", "src": "AMSCO p.141", "quote": "The host might welcome men in the public areas on the main level", "opts": ["Sequent occupancy", "A culture hearth", "Neolocalism", "A gendered space inside a home (etiquette)", "Ethnocentrism"], "key": 3, "id": 51}, {"t": "mc", "topic": "3.2", "tag": "gender", "f": ["F39"], "q": "In Iran and India, some restaurants and parks are designated “men only” or “women only.” How do women view these areas?", "hint": "The book gives both views.", "exp": "This is a good “argue both sides” example: safety/community vs. discrimination. It also shows a gendered space.", "src": "AMSCO p.141", "quote": "Many women view these \"women only\" areas as a safe place to gather and discuss issues, while others view them as discriminatory.", "opts": ["All women see them as safe", "Many see them as safe places to gather; others see them as discriminatory", "They are required by Christian law", "All women see them as discrimination", "They are only used by tourists"], "key": 1, "id": 52}, {"t": "tf", "topic": "3.2", "tag": "gender", "f": ["F39"], "q": "TRUE or FALSE: The textbook says every woman views “women only” spaces the same way.", "ans": false, "hint": "Read the end of that paragraph: “while others…”", "exp": "False. Many view them as safe; others view them as discriminatory — perspectives differ.", "src": "AMSCO p.141", "quote": "while others view them as discriminatory", "id": 53}, {"t": "mc", "topic": "3.2", "tag": "gender", "f": ["F41"], "q": "Your notes cite Mexico City, where 19% of women surveyed feel “very safe” in transport. This is evidence of…", "hint": "Public transport + women's safety.", "exp": "Gendered spaces affect how people can use public places. Notes also say: in Japan, women say unwanted advances occur regularly.", "src": "Packet 3.2", "quote": "Mexico City: 19% of women surveyed reported that they feel very safe in transport.", "opts": ["Terrace farming", "Sequent occupancy", "A gendered space issue: how safe women feel in public landscapes", "A charter group", "A culture hearth"], "key": 2, "id": 54}, {"t": "mc", "topic": "3.2", "tag": "gender", "f": ["F41"], "q": "Per your notes, in <b>Japan</b>…", "hint": "It is the second gendered-space example in your packet.", "exp": "Mexico City and Japan are the packet's two gendered-space examples. You must also supply your own example (the packet leaves a blank).", "src": "Packet 3.2", "quote": "In Japan, women say unwanted advances occur regularly.", "opts": ["Women say unwanted advances occur regularly", "The government bans gender roles", "Women have no public presence", "Men feel unsafe in public", "All transport is women-only"], "key": 0, "id": 55}, {"t": "mc", "topic": "3.2", "tag": "gender", "f": ["F40"], "q": "As countries become more economically and socially developed, women typically gain…", "hint": "Development opens opportunity.", "exp": "Your packet’s “Role of Women” section: development expands women's access to education, jobs and property rights, which can change what the landscape looks like (e.g., more women visible in workplaces and public life).", "src": "Packet 3.2", "quote": "As countries become more economically and socially developed, women have access to more education, the workforce, and property rights.", "opts": ["Less access to education", "Fewer rights", "More access to education, the workforce, and property rights", "Only domestic roles", "A ban on leadership"], "key": 2, "id": 56}, {"t": "mc", "topic": "3.2", "tag": "gender", "f": ["F40"], "q": "According to your notes, in <b>traditional cultures</b> the primary role of a woman is often…", "hint": "Traditional = limited education/work access.", "exp": "Contrast with developed countries where women gain education, jobs, and property rights.", "src": "Packet 3.2", "quote": "In traditional cultures, oftentimes the primary role of a woman is to have children, NOT be active in education or the workforce.", "opts": ["To lead the government", "To own all property", "To work in factories", "To have children, not to be active in education or the workforce", "To design cities"], "key": 3, "id": 57}, {"t": "mc", "topic": "3.2", "tag": "landscape", "f": ["F44"], "q": "A <b>cultural region</b> is usually determined by characteristics such as…", "hint": "Cultural traits, not physical measurements.", "exp": "Regions are often not bounded by political borders. A <b>transition zone</b> is where two cultures mix, e.g., El Paso, Texas (Spanish and English).", "src": "AMSCO p.141", "quote": "Cultural regions are usually determined based on characteristics such as religion, language, and ethnicity.", "opts": ["Taxes and tariffs only", "Latitude only", "Population density only", "Religion, language, and ethnicity", "Elevation and rainfall only"], "key": 3, "id": 58}, {"t": "mc", "topic": "3.2", "tag": "landscape", "f": ["F44"], "q": "People in border communities such as El Paso, Texas, are often fluent in both Spanish and English. This is an example of…", "hint": "Border = mixing.", "exp": "The book says cultural regions do not always follow political borders.", "src": "AMSCO p.141", "quote": "Cultural regions do not always follow political borders.", "opts": ["A charter group", "A culture hearth", "A ban on bilingualism", "A transition zone where two cultures mix", "Placelessness"], "key": 3, "id": 59}, {"t": "mc", "topic": "3.2", "tag": "landscape", "f": ["F44"], "q": "A <b>culture realm</b> is…", "hint": "Think “very large region.”", "exp": "Realms contain regions with diversity. <b>Example (slides):</b> Anglo-American; Latin America.", "src": "AMSCO p.141", "quote": "Geographers also identify larger areas, culture realms, that include several regions.", "opts": ["A larger area made up of several regions that share some traits like language families, religion, food, architecture, or history", "A religion's sacred site", "A single building", "A single neighborhood", "A voting district"], "key": 0, "id": 60}, {"t": "mc", "topic": "3.2", "tag": "religion", "f": ["F45"], "q": "Shinto followers view certain mountains and rocks as the homes of spirits. These are…", "hint": "Spirits dwell there.", "exp": "Other sacred sites matter for what happened there, e.g., Mt. Sinai for Jews, Christians and Muslims.", "src": "AMSCO p.142", "quote": "followers of Shinto view certain mountains and rocks as the homes of spirits", "opts": ["Isoglosses", "Sacred spaces where deities dwell", "Ethnic enclaves", "Taboos", "Postmodern buildings"], "key": 1, "id": 61}, {"t": "mc", "topic": "3.2", "tag": "religion", "f": ["F45"], "q": "Which cities are given as having special religious meaning?", "hint": "Three cities, three faiths.", "exp": "The book names Jerusalem (Israel), Mecca (Saudi Arabia), and Lhasa (Tibet).", "src": "AMSCO p.142", "quote": "Jerusalem (Israel), Mecca (Saudi Arabia), and Lhasa (Tibet)", "opts": ["Denver, Santa Fe, and Las Vegas", "Houston, Shanghai, and Tokyo", "Jerusalem, Mecca, and Lhasa", "Chicago, Harlem, and Pilsen", "Miami, Plymouth, and Jamestown"], "key": 2, "id": 62}, {"t": "mc", "topic": "3.2", "tag": "religion", "f": ["F46"], "q": "Which is a way religion shapes the everyday cultural landscape?", "hint": "Memorial spaces near worship.", "exp": "Also: restaurants and food markets catering to religious groups, and signs in the language/alphabet of a group.", "src": "AMSCO p.142", "quote": "Memorial spaces to the dead, such as cemeteries, are traditionally located close to worship spaces.", "opts": ["Terrace farms only", "Cemeteries traditionally located close to worship spaces", "Postmodern skyscrapers only", "Wilderness areas", "Bilingual traffic signs only"], "key": 1, "id": 63}, {"t": "mc", "topic": "3.2", "tag": "religion", "f": ["F47"], "q": "Churches in northern Europe have steep-pitched roofs while churches near the eastern Mediterranean have domes. Why?", "hint": "Snow can collapse a flat roof.", "exp": "Steep roofs shed snow. Domes reflect Roman style. Religion + environment shape architecture.", "src": "AMSCO p.143", "quote": "churches in northern Europe have steep-pitched roofs designed for snow to slide off in the winter", "opts": ["Because of ethnic enclaves", "Environmental adaptation and influence of local architecture (snow slides off steep roofs)", "Domes are illegal in the Mediterranean", "Because of terrace farming", "The church bans domes in the north"], "key": 1, "id": 64}, {"t": "mc", "topic": "3.2", "tag": "religion", "f": ["F47"], "q": "Many Hindu shrines and temples are located near rivers and streams because…", "hint": "Purification.", "exp": "Sacred sites such as the Ganges River let pilgrims bathe for purification; cremation and spreading ashes in the Ganges are also practiced.", "src": "AMSCO p.143", "quote": "Many Hindu shrines and temples are located near rivers and streams for this very purpose.", "opts": ["Rivers are illegal places to worship", "Temples need irrigation", "Rivers have no meaning", "Pilgrims bathe for purification (e.g., the Ganges River)", "Hindus ban temples in cities"], "key": 3, "id": 65}, {"t": "mc", "topic": "3.2", "tag": "religion", "f": ["F47"], "q": "What is the difference between a Buddhist <b>stupa</b> and a <b>pagoda</b>?", "hint": "One is a monument, the other a temple.", "exp": "Both are sacred spaces near which believers meditate.", "src": "AMSCO p.144", "quote": "Pagodas are also a common architectural style that developed from stupas", "opts": ["Stupas are always skyscrapers", "There is no difference at all", "Stupas store relics and memorialize events; pagodas developed from stupas and are used as temples that people can enter", "Stupas are Muslim; pagodas are Christian", "Pagodas store only food"], "key": 2, "id": 66}, {"t": "mc", "topic": "3.2", "tag": "religion", "f": ["F47"], "q": "A <b>diaspora</b> occurs when…", "hint": "Think scattering.", "exp": "Jews spread throughout the world because of exile, persecution, or voluntary migration — the Diaspora.", "src": "AMSCO p.144", "quote": "A diaspora occurs when one group of people is dispersed to various locations.", "opts": ["One group of people is dispersed to various locations", "A religion bans migration", "Two groups merge into one", "A language is invented", "A group stays in one place"], "key": 0, "id": 67}, {"t": "mc", "topic": "3.2", "tag": "religion", "f": ["F47"], "q": "In places where Islam is widely practiced, which structure is the most prominent on the landscape?", "hint": "Daily prayer is called from minarets.", "exp": "Minaret = Arabic for beacon. The torii marks a Shinto shrine entrance.", "src": "AMSCO p.145", "quote": "the mosque is the most prominent structure on the landscape", "opts": ["The synagogue", "The stupa", "The pagoda", "The torii", "The mosque, with domes and minarets"], "key": 4, "id": 68}, {"t": "mc", "topic": "3.2", "tag": "religion", "f": ["F47"], "q": "A <b>torii</b> is…", "hint": "Shinto hearth = Japan.", "exp": "Shinto emphasizes honoring ancestors and the relationship between people and nature.", "src": "AMSCO p.145", "quote": "A torii is a traditional gate usually found in front of or within a Shinto shrine.", "opts": ["A Hindu river", "A gate marking the transition from the outside world to a Shinto sacred space", "A Jewish burial", "A Buddhist relic", "A Muslim minaret"], "key": 1, "id": 69}, {"t": "mc", "topic": "3.2", "tag": "ethnicity", "f": ["F48"], "q": "The <b>charter group</b> is…", "hint": "First in.", "exp": "Native Americans were the charter group in the Americas (place names Mt. Denali, Miami). English settlements named Plymouth and Jamestown.", "src": "AMSCO p.145", "quote": "The first group to establish cultural and religious customs in a space is known as the charter group.", "opts": ["A global company", "The newest immigrant group", "A government agency", "The first group to establish cultural and religious customs in a space", "A group displaced by conflict"], "key": 3, "id": 70}, {"t": "mc", "topic": "3.2", "tag": "ethnicity", "f": ["F49"], "q": "<b>Ethnic islands</b> form in…", "hint": "Island = isolated, rural.", "exp": "Examples: Pennsylvania Dutch and Amish (US), Mennonites in Alberta (Canada).", "src": "AMSCO p.146", "quote": "In rural areas, ethnic concentrations form ethnic islands.", "opts": ["Urban downtowns", "Only in postmodern cities", "Oceans", "Only in Europe", "Rural areas, with strong, long-lasting cohesion because of less interaction with other groups"], "key": 4, "id": 71}, {"t": "mc", "topic": "3.2", "tag": "ethnicity", "f": ["F49"], "q": "Chinatowns appear in Melbourne, Liverpool, San Francisco and other cities. The name often…", "hint": "Name vs. residents.", "exp": "Many Chinatowns now primarily cater to tourists.", "src": "AMSCO p.146", "quote": "The name tends to live on even if the original occupants have moved out or assimilated", "opts": ["Is banned by law", "Describes a rural area", "Lives on even if original occupants have moved out or assimilated", "Disappears immediately", "Changes every year"], "key": 2, "id": 72}, {"t": "mc", "topic": "3.2", "tag": "ethnicity", "f": ["F50"], "q": "At the <b>national scale</b>, African Americans are concentrated in the southeast United States. At the city scale they are…", "hint": "Zoom in and the pattern changes.", "exp": "The distribution varies by scale. Discrimination limited neighborhoods where African Americans could live in many US cities. Teacher key: at the local level concentrations are urban; Chicago has neighborhoods >49.1% African American.", "src": "AMSCO p.146", "quote": "At the national scale, African Americans are concentrated in the southeast United States.", "opts": ["Evenly spread in every neighborhood", "Absent from cities", "Often clustered in particular neighborhoods", "Concentrated only on farms", "Spread randomly"], "key": 2, "id": 73}, {"t": "mc", "topic": "3.2", "tag": "ethnicity", "f": ["F51"], "q": "Harlem has housed Jews from Eastern Europe, then African Americans, then Puerto Ricans, leaving synagogues, Marcus Garvey Park and Luis Munoz Marin Boulevard. This is…", "hint": "Layers of different groups over time.", "exp": "Sequent occupancy: groups leave cultural imprints that accumulate over time. Packet: “each contributing to the overall cultural landscape over time.” Also Chicago's Pilsen (German/Czech → Hispanic).", "src": "AMSCO p.147", "quote": "a process geographers call sequent occupancy", "opts": ["Sequent occupancy", "Diffusion by stimulus", "Neolocalism", "Ethnocentrism", "Placelessness"], "key": 0, "id": 74}, {"t": "mc", "topic": "3.2", "tag": "ethnicity", "f": ["F52"], "q": "A neighborhood in a large city holds a festival to honor the cuisine, religion and history of migrants who settled there. This is an example of…", "hint": "Re-embracing the uniqueness of a place.", "exp": "Neolocalism is a response to erosion of traditions from global culture and changing occupancy.", "src": "AMSCO p.147", "quote": "neolocalism, the process of re-embracing the uniqueness and authenticity of a place", "opts": ["Neolocalism", "Cultural appropriation", "Relocation diffusion", "Ethnocentrism", "Placelessness"], "key": 0, "id": 75}, {"t": "mc", "topic": "3.2", "tag": "ethnicity", "f": ["F52"], "q": "When a new group moves into a neighborhood, what can result?", "hint": "Both outcomes are possible.", "exp": "Tension often increases when the incoming group changes or destroys the landscape without considering existing residents; existing residents may show prejudice.", "src": "AMSCO p.147", "quote": "can create cultural, economic and political tension", "opts": ["Only violence always", "Positive changes, or cultural, economic and political tension", "Only benefits always", "The neighborhood disappears", "Nothing ever changes"], "key": 1, "id": 76}, {"t": "mc", "topic": "3.2", "tag": "landscape", "f": ["F53"], "q": "Per your notes, <b>terrace farming</b> is…", "hint": "Steps cut into a hillside.", "exp": "Rice farming is the most common terrace crop, though others can be grown too.", "src": "Packet 3.2", "quote": "Practice of cutting flat areas out of mountainous terrain in order to make it arable.", "opts": ["Building skyscrapers", "Farming on frozen tundra", "Making reservations", "Cutting flat areas out of mountainous terrain to make it arable", "Hunting whales"], "key": 3, "id": 77}, {"t": "mc", "topic": "3.2", "tag": "landscape", "f": ["F53"], "q": "Per your notes, <b>subsistence whaling</b> by indigenous tribes in northern Alaska reflects…", "hint": "The whale is divided among the community.", "exp": "The bowhead whale is both a food source and cultural lifestyle; the annual harvest is divided among community members.", "src": "Packet 3.2", "quote": "Indicates cultural values of collectivism, sustainability", "opts": ["Sharia", "Postmodern architecture", "Placelessness", "Cultural values of collectivism and sustainability and the way knowledge is passed down", "Individualism"], "key": 3, "id": 78}, {"t": "mc", "topic": "3.2", "tag": "landscape", "f": ["F53"], "q": "The Indian Removal Act of 1830 and the Trail of Tears resulted in…", "hint": "Forcible removal.", "exp": "Reservations were plots of land where tribes were forced to live. This shows how land use reflects power and culture.", "src": "Packet 3.2", "quote": "Indian Removal Act of 1830: Forcibly removed indigenous peoples from land", "opts": ["Free choice of housing", "Indigenous peoples being forcibly removed from land, with reservations established", "Equal property rights", "Postmodern urbanization", "Voluntary migration"], "key": 1, "id": 79}, {"t": "mc", "topic": "3.2", "tag": "landscape", "f": ["F34"], "q": "Your notes say traditional architecture is reflective of history, culture and…", "hint": "Fill in the blank from the packet.", "exp": "Traditional = influenced by environment and local materials. Example: igloo/adobe/wood.", "src": "Packet 3.2", "quote": "Reflective of history, culture and CLIMATE", "opts": ["Religion only", "Taxes", "Skyscrapers", "Climate", "Language families"], "key": 3, "id": 80}, {"t": "mc", "topic": "3.3", "tag": "patterns", "f": ["F60"], "q": "<b>Cultural patterns</b> are…", "hint": "Patterns = repeated across space.", "exp": "Geographers study patterns across time and space: religions, ethnicities, nationalities. They help placemaking.", "src": "AMSCO p.148", "quote": "Cultural patterns consist of related sets of cultural traits and complexes that create similar behaviors across space.", "opts": ["Related sets of cultural traits and complexes that create similar behaviors across space", "Laws of one country", "Physical features of land", "Only population graphs", "Random individual habits"], "key": 0, "id": 81}, {"t": "mc", "topic": "3.3", "tag": "patterns", "f": ["F60"], "q": "Geographers map a culture hearth first to…", "hint": "Origin → movement → prediction.", "exp": "A culture hearth is where a religion or ethnicity began.", "src": "AMSCO p.148", "quote": "Geographers start by mapping a culture hearth", "opts": ["Remove all borders", "Prove it is superior", "Track a religion or ethnicity's movement and predict its future direction", "Show only rainfall", "Delete it from the map"], "key": 2, "id": 82}, {"t": "mc", "topic": "3.3", "tag": "patterns", "f": ["F61"], "q": "The “Largest Religion by Country” world map shows Christianity is most widespread by territory. What does the book warn about the scale?", "hint": "The scale hides detail.", "exp": "At the regional level within the US, Baptists are the most common group in the Southeast — invisible on the world map. Similarly, the map doesn't show Catholics vs. Protestants.", "src": "AMSCO p.149", "quote": "the scale of the data hides the fact that the United States has great religious diversity", "opts": ["Small-scale country-level data hides diversity inside countries", "The map proves one religion in each town", "The map shows every individual", "The map is at the city level", "Scale never matters"], "key": 0, "id": 83}, {"t": "mc", "topic": "3.3", "tag": "patterns", "f": ["F62"], "q": "Which region and religious group are correctly matched in the US?", "hint": "Match settlement history to place.", "exp": "Congregationalists — New England; Baptists and Methodists — Southeast; Lutherans — Midwest (German/Scandinavian farmland); Mormons — Utah; Catholics — urban Northeast and Southwest; Jews, Muslims, Hindus — urban areas.", "src": "AMSCO p.149", "quote": "Lutherans live mostly in the Midwest", "opts": ["Baptists — New England", "Catholics — only the Great Plains", "Mormons — Southeast", "Congregationalists — Utah", "Lutherans — Midwest"], "key": 4, "id": 84}, {"t": "mc", "topic": "3.3", "tag": "patterns", "f": ["F63"], "q": "Geographers distinguish ethnicity from nationality. Which pair is correct?", "hint": "Nation/country vs. culture.", "exp": "Example from the book: Russian Jews make up a different ethnicity than Russians in general. Many Hispanics in the US identify as American first or Hispanic first — the order is personal.", "src": "AMSCO p.150", "quote": "Most geographers distinguish between nationality-", "opts": ["Nationality = connection to a country; ethnicity = group cultural traits", "Ethnicity = citizenship; nationality = language", "Ethnicity = border", "Nationality = ancestry only", "Both mean the same"], "key": 0, "id": 85}, {"t": "mc", "topic": "3.3", "tag": "forces", "f": ["F64"], "q": "<b>Centripetal forces</b> are…", "hint": "Pulling toward the center.", "exp": "Examples: common language and religion, shared heritage, ethnic unity and tolerance, a fair legal system, a charismatic leader. <b>Example:</b> the holiday season from November through December unifies many Americans; the German Christmas tree spread across the US.", "src": "AMSCO p.150", "quote": "Centripetal forces are those that unify a group of people or a region.", "opts": ["Forces that always lead to war", "Forces that unify a group of people or a region", "Forces that divide a region", "Forces that destroy languages", "Forces that create taboos"], "key": 1, "id": 86}, {"t": "mc", "topic": "3.3", "tag": "forces", "f": ["F65"], "q": "<b>Centrifugal forces</b> are…", "hint": "Pushing away from the center.", "exp": "Examples: different languages and religions, a separate past, ethnic conflict, racism, unequal laws, dictatorial leadership. They are “essentially centripetal forces in reverse.”", "src": "AMSCO p.150", "quote": "Centrifugal forces are those that divide a group of people or a region.", "opts": ["Forces that divide a group of people or a region", "Forces that cause diffusion", "Forces that create sense of place", "Forces that unify a region", "Forces from only one religion"], "key": 0, "id": 87}, {"t": "mc", "topic": "3.3", "tag": "forces", "f": ["F65"], "q": "Northern Ireland's history of violence illustrates…", "hint": "Catholics vs. Anglicans.", "exp": "Both are Christian, but competition over territory, power and cultural influence drove repeated violence for centuries.", "src": "AMSCO p.151", "quote": "the competition over territory, political power, and cultural influence drove the region into repeated violence", "opts": ["Postmodern architecture", "Centripetal forces of shared religion", "Terrace farming", "Centrifugal forces from religious competition over territory, power and influence", "A culture hearth for democracy"], "key": 3, "id": 88}, {"t": "mc", "topic": "3.3", "tag": "forces", "f": ["F65"], "q": "In Iraq, which divisions are cited?", "hint": "Islam + ethnicity.", "exp": "Cultural differences can lead to friction and competition for land, resources and autonomy.", "src": "AMSCO p.151", "quote": "there are regional divisions between the Shiite majority in the east and the Sunnis in the west", "opts": ["Shintoists vs. Catholics", "Christians vs. Buddhists", "Mormons vs. Methodists", "Shiite majority in the east, Sunnis in the west, and a Kurdish concentration in the north", "Hindus vs. Jews"], "key": 3, "id": 89}, {"t": "mc", "topic": "3.3", "tag": "religion", "f": ["F66"], "q": "<b>Sharia</b> is…", "hint": "Law from a holy book.", "exp": "The Taliban in Afghanistan adopted Sharia as the law of the land.", "src": "AMSCO p.151", "quote": "Sharia, or the legal framework of a country derived from Islamic edicts taken from their holy book", "opts": ["A legal framework derived from Islamic edicts in the Qur'an", "A Buddhist temple", "A type of dialect", "A tax law", "A Hindu festival"], "key": 0, "id": 90}, {"t": "mc", "topic": "3.3", "tag": "religion", "f": ["F66"], "q": "<b>Blue laws</b> in the United States…", "hint": "Sunday restrictions.", "exp": "Shows religious influence on laws even in industrialized countries. Colorado car dealerships must be closed on Sunday.", "src": "AMSCO p.151", "quote": "blue laws, laws that restrict certain activities", "opts": ["Set speed limits", "Restrict certain activities, like selling alcohol, on Sunday", "Ban all religion", "Apply only in Utah", "Require everyone to wear blue"], "key": 1, "id": 91}, {"t": "mc", "topic": "3.3", "tag": "religion", "f": ["F66"], "q": "Which pair is correct about food taboos?", "hint": "Cows sacred; pork forbidden.", "exp": "Most faiths include some food taboos, prohibitions against eating and drinking certain items.", "src": "AMSCO p.151", "quote": "many Hindus do not eat beef, and many Jews and Muslims do not eat pork", "opts": ["Many Jews avoid fish", "Many Hindus avoid pork", "Many Buddhists avoid water", "Many Muslims avoid beef", "Many Hindus avoid beef; many Jews and Muslims avoid pork"], "key": 4, "id": 92}, {"t": "mc", "topic": "3.3", "tag": "religion", "f": ["F66"], "q": "Which pair of weekly worship days is correct?", "hint": "Friday, Sat, Sunday.", "exp": "Jews gather on Friday evening or Saturday morning. Many Muslims pray five times a day.", "src": "AMSCO p.151", "quote": "Muslims usually gather on Friday, Jews on Friday evening or Saturday morning, and Christians on Sunday", "opts": ["Jews — Wednesday; Muslims — Monday", "Buddhists — Friday only", "Muslims — Friday; Christians — Sunday", "Muslims — Sunday; Christians — Friday", "Christians — Saturday only"], "key": 2, "id": 93}, {"t": "mc", "topic": "3.3", "tag": "religion", "f": ["F66"], "q": "Valentine's Day, St. Patrick's Day and Mardi Gras show that…", "hint": "Roots in Christian holy days.", "exp": "Religion is a source of daily, weekly and annual practices.", "src": "AMSCO p.151", "quote": "Valentine's Day, St. Patrick's Day, and Mardi Gras all originated as Christian holy days.", "opts": ["They are Buddhist in origin", "Holidays never relate to religion", "They began as government holidays", "They are ethnic enclaves", "Holidays now treated as secular often originated as religious practices"], "key": 4, "id": 94}, {"t": "mc", "topic": "3.3", "tag": "gender", "f": ["F67"], "q": "<b>Fundamentalism</b> is…", "hint": "Literal interpretation.", "exp": "Fundamentalists believe people should live traditional lifestyles similar to those prescribed in the holy writings.", "src": "AMSCO p.152", "quote": "fundamentalism, an attempt to follow a literal interpretation of a religious faith", "opts": ["A map projection", "A form of diffusion", "An attempt to follow a literal interpretation of a religious faith", "A rejection of all religion", "A style of architecture"], "key": 2, "id": 95}, {"t": "mc", "topic": "3.3", "tag": "gender", "f": ["F67"], "q": "In some fundamentalist traditions, what is likely for women?", "hint": "This is the link between religion and gender roles.", "exp": "This is a strong gender connection in 3.3. Fundamentalists also enforce strict standards of dress and behavior, often through law.", "src": "AMSCO p.152", "quote": "women are likely to leave school at a young age, to live in an arranged marriage, and to avoid working outside the home", "opts": ["To lead the government", "To receive extra education", "To own all property", "To be required to work outside the home", "To leave school at a young age, live in an arranged marriage, and avoid working outside the home"], "key": 4, "id": 96}, {"t": "mc", "topic": "3.3", "tag": "religion", "f": ["F67"], "q": "Fundamentalism often weakens with greater distance from the religious hearth. This is called…", "hint": "Strength fades with distance.", "exp": "Islam's hearth is the Arabian Peninsula; fundamentalism is less prevalent in Malaysia and Indonesia. Sharia is strongest in Saudi Arabia and Yemen.", "src": "AMSCO p.152", "quote": "The strength of fundamentalism often diminishes with greater distance from the religious hearth, which is known as distance decay.", "opts": ["Sequent occupancy", "Distance decay", "Cultural appropriation", "Placelessness", "Neolocalism"], "key": 1, "id": 97}, {"t": "mc", "topic": "3.3", "tag": "religion", "f": ["F67"], "q": "A <b>theocracy</b> is…", "hint": "Government run by religious leaders.", "exp": "Iran is a theocracy; its Supreme Leader is the head of state and its highest religious authority.", "src": "AMSCO p.152", "quote": "Some fundamentalist countries, such as Iran, are theocracies", "opts": ["A culture realm", "A country with a king who is not religious", "A country whose government is run by religious leaders through religious laws", "A democracy", "A country with no laws"], "key": 2, "id": 98}, {"t": "mc", "topic": "3.3", "tag": "attitudes", "f": ["F68"], "q": "Ethnocentrism may lead to centrifugal forces such as…", "hint": "“We” versus “them.”", "exp": "A “we versus them” mentality can grow without efforts to understand other cultures. It can also cause tension between states.", "src": "AMSCO p.152", "quote": "Ethnocentrism may lead to centrifugal forces within a state, such as discrimination, intolerance, violence, and mass killings.", "opts": ["Diffusion of corn", "Placemaking", "Sense of place", "Discrimination, intolerance, violence, and mass killings", "Shared language"], "key": 3, "id": 99}, {"t": "mc", "topic": "3.3", "tag": "attitudes", "f": ["F68"], "q": "The culture-relativist perspective generally leads to…", "hint": "Understanding builds unity.", "exp": "Understanding other cultures from the inside fosters empathy and mutual respect.", "src": "AMSCO p.153", "quote": "The culture-relativist perspective generally leads to centripetal forces within multiethnic societies", "opts": ["More ethnocentrism", "Centrifugal forces and war", "Cultural isolation", "Language extinction", "Centripetal forces within multiethnic societies and improved relations between states"], "key": 4, "id": 100}, {"t": "mc", "topic": "3.3", "tag": "attitudes", "f": ["F68"], "q": "<b>Cultural appropriation</b> is…", "hint": "Borrowing + power imbalance.", "exp": "Examples: naming sports teams after indigenous people; costumes that propagate stereotypes. There is debate about where boundaries lie.", "src": "AMSCO p.153", "quote": "Cultural appropriation is the action of adopting traits, icons, or other elements of another culture.", "opts": ["Moving to a new country", "Adopting traits, icons, or elements of another culture — especially concerning when a majority culture takes from a minority, or when used out of context", "Inventing a new language", "Preserving your own traditions", "Land set aside for protection"], "key": 1, "id": 101}, {"t": "mc", "topic": "3.3", "tag": "realms", "f": ["F44"], "q": "Which description fits the <b>Anglo-American</b> culture realm per your slides?", "hint": "English + Christianity.", "exp": "Ethnicities include Indigenous, European, African, Hispanic.", "src": "Slides 3.3", "quote": "Language: English (Indo-European Family)", "opts": ["Arabic, Islam, Sharia", "Mandarin, Buddhism", "Hindi, Hinduism", "English (Indo-European), Christianity, European settlement and colonization", "Spanish, Roman Catholicism, colonized by Europeans"], "key": 3, "id": 102}, {"t": "mc", "topic": "3.3", "tag": "realms", "f": ["F44"], "q": "Which description fits the <b>Latin America</b> culture realm per your slides?", "hint": "Spanish + Catholicism.", "exp": "Ethnicities: Hispanic, Afro-Caribbean and Afro-Latino, European, Indigenous.", "src": "Slides 3.3", "quote": "Language: Spanish (Indo-European Family)", "opts": ["Spanish (Indo-European family), Roman Catholicism, colonized by Europeans", "Japanese, Shinto", "Arabic, Islam", "Hindi, Hinduism", "English, Protestant"], "key": 0, "id": 103}, {"t": "mc", "topic": "3.3", "tag": "realms", "f": ["F44"], "q": "Your slides remind you about culture realms: remember the importance of…", "hint": "The same warning appears in the textbook.", "exp": "Realms are broad generalizations.", "src": "Slides 3.3", "quote": "Note: Remember the importance of scale of analysis!", "opts": ["Ignoring maps", "Latitude", "Only memorization", "Population pyramids", "Scale of analysis — a small-scale view will not always be totally accurate"], "key": 4, "id": 104}, {"t": "mc", "topic": "3.3", "tag": "forces", "f": ["F64"], "q": "Per your slides, centripetal forces include…", "hint": "Unify.", "exp": "Centrifugal = multiple competing ethnicities, languages or religions.", "src": "Slides 3.3", "quote": "Examples: Common language, ethnicity, religion", "opts": ["Inequality", "Common language, ethnicity, religion", "Discrimination", "Multiple competing ethnicities", "Unrest"], "key": 1, "id": 105}, {"t": "sa", "topic": "3.2", "tag": "gender", "f": ["F38", "F39", "F41"], "q": "Define <b>gendered space</b> and give an example <i>not</i> from the US (workbook question).", "model": "A gendered space is a place in the cultural landscape used to reinforce or accommodate gender roles for men and women. Example: in Iran and India some restaurants and parks are designated “men only” or “women only.” Another: Japan, where women report regular unwanted advances.", "points": ["Definition: place in landscape that reinforces or accommodates gender roles", "Specific non-US example (Iran/India men-only/women-only; Japan; Mexico City; Pakistan gender-segregated schools)", "Explains what the example shows about cultural values"], "hint": "Definition + a non-US example + what it shows.", "src": "AMSCO p.141", "quote": "In Iran and India, some restaurants and parks are designated \"men only\" or \"women only\".", "note": "", "id": 106}, {"t": "sa", "topic": "3.2", "tag": "gender", "f": ["F36", "F37"], "q": "Compare gender roles in <b>folk culture</b> and <b>popular culture</b>.", "model": "Folk culture: clearly defined roles — women handle domestic responsibilities (farming, educating children, caring for family); men work outside the home earning money and lead in religion and politics. Popular culture: roles are challenged; women have more access to education and work outside the home, gaining economic power and leadership opportunities. AMSCO table: traditional = well-defined gender roles; popular = weakly defined.", "points": ["Folk roles: women domestic; men outside income + leaders", "Popular: roles challenged", "Women's access to education → work → economic power → leadership", "Uses well-defined vs weakly defined"], "hint": "Use the three words: education, economic power, roles.", "src": "AMSCO p.141", "quote": "In popular culture, traditional gender-specific roles are challenged.", "note": "", "id": 107}, {"t": "sa", "topic": "3.2", "tag": "gender", "f": ["F40"], "q": "Explain how development changes the role of women and how that might appear in the cultural landscape.", "model": "As countries develop, women gain access to education, the workforce and property rights (packet). This can appear in the landscape as more women visible in workplaces, schools and public space, and less rigid separation of male/female spaces. Contrast: traditional cultures where women's primary role is having children and the landscape reflects domestic roles.", "points": ["Development → education, workforce, property rights", "Contrast with traditional roles", "Landscape evidence (presence in workplaces/public spaces, less gender separation)"], "hint": "Cause → effect → what you would see.", "src": "Packet 3.2", "quote": "As countries become more economically and socially developed, women have access to more education, the workforce, and property rights.", "note": "", "id": 108}, {"t": "sa", "topic": "3.2", "tag": "gender", "f": ["F38", "F39"], "q": "“Women only” parks and transport are described by some as safe and by others as discriminatory. Explain <b>both</b> views using the textbook.", "model": "Safe view: many women see women-only areas as safe places to gather and discuss issues (AMSCO p.141); notes mention low safety feelings in Mexico City transport (19% feel very safe) and unwanted advances in Japan. Discrimination view: others see them as discriminatory because they restrict who can use public space and reflect unequal gender roles. Best answers acknowledge both perspectives.", "points": ["Safe view with evidence", "Discriminatory view with reasoning", "Names the concept gendered space"], "hint": "Two perspectives, one example each.", "src": "AMSCO p.141", "quote": "Many women view these \"women only\" areas as a safe place to gather and discuss issues, while others view them as discriminatory.", "note": "", "id": 109}, {"t": "sa", "topic": "3.2", "tag": "gender", "f": ["F42"], "q": "<b>Workbook:</b> “What type of roles can also fit inter-gender categories?” Write your answer.", "model": "Your sources do not define “inter-gender roles.” Use the workbook video notes or ask Mrs. Knight. A cautious answer: roles that are not strictly assigned to men or women — people performing roles regardless of gender, such as leaders, teachers, or farmers. This answer is reasoned, not quoted.", "points": ["Notes that roles can be shared/not limited by gender", "Gives an example", "Avoids claiming it is in the textbook"], "hint": "The textbook does not answer this — check your video notes.", "src": "Workbook", "quote": "3. What type of roles can also fit inter gender categories?", "note": "Not defined in AMSCO/packet. Verify with your video notes.", "id": 110}, {"t": "sa", "topic": "3.2", "tag": "gender", "f": ["F42", "F30"], "q": "<b>Photo analysis:</b> You are given a photo. What six elements do you analyze, and how do you describe gender roles/gendered space?", "model": "Use the workbook table: physical features; agriculture & industrial practices; religious & linguistic characteristics; sequent occupancy; architecture; land use. For gender: ask who is present, which spaces are used by whom, and whether the landscape separates
